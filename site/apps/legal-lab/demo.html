<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>На подпись · РУДН</title><link rel="icon" href="data:,"><style>body{margin:0;background:#e9eff5;font-family:system-ui,Arial,sans-serif}.demo-wrap{max-width:1440px;margin:24px auto;padding:0 20px}.demo-tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 4px 18px;font-size:14px;color:#455e75}.demo-tools a{color:#005d98;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.demo-tools strong{margin-right:auto}.demo-tools select{min-height:44px;border:1px solid #c5d4e2;border-radius:8px;padding:8px;background:white;color:#132d46}@media(max-width:650px){.demo-wrap{margin:8px auto;padding:0 6px}.demo-tools{padding:8px;font-size:13px;gap:10px}}</style></head><body><div class="demo-wrap"><div class="demo-tools"><strong>РУДН</strong><a id="studentLink" href="?role=student">Студент</a><a id="teacherLink" href="?role=teacher">Преподаватель</a><select id="locale" aria-label="Language"><option value="ru">Русский</option><option value="en">English</option><option value="zh">中文</option></select></div><div id="legalLab"></div></div><script type="module">
import {bootstrapUpdateCoordinator} from '../../assets/js/platform-update-coordinator.js';
import {getSharedPlatformDiagnostics} from '../../assets/js/diagnostics.js';
import {backend} from '../../assets/js/backend.js?v=1.3.10';
import {mountLegalLab} from './entry.mjs';
const query=new URLSearchParams(location.search),role=query.get('role')==='teacher'?'teacher':'student';
const language=document.getElementById('locale');language.value=['ru','en','zh'].includes(query.get('lang'))?query.get('lang'):'ru';
const diagnosticService=getSharedPlatformDiagnostics({backend,getLocale:()=>language.value,getModule:()=> 'legal-lab'});
let diagnosticScope=diagnosticService.forModule('legal-lab');
const diagnostics={record:(...args)=>diagnosticScope.record(...args),error:(...args)=>diagnosticScope.error(...args),span:(...args)=>diagnosticScope.span(...args)};
void backend.ensureDiagnosticIdentity().then(()=>{diagnosticScope.destroy();diagnosticScope=diagnosticService.forModule('legal-lab')}).catch(()=>{});
const handle=await mountLegalLab(document.getElementById('legalLab'),{diagnostics,owner:'demo:'+role,demo:true,isTeacher:role==='teacher',locale:language.value,period:'demo-2026',group:'Демонстрация',groups:['Демонстрация'],onExit:()=>{location.href='demo.html'}});
const coordinator=bootstrapUpdateCoordinator({getAdapters:()=>[handle],backend,diagnostics,module:'legal-lab',getOwner:()=> 'demo:'+role,getRoute:()=>role+location.hash});await coordinator.restorePending();
function shell(lang){document.documentElement.lang=lang;document.getElementById('studentLink').textContent=lang==='en'?'Student':lang==='zh'?'学生':'Студент';document.getElementById('teacherLink').textContent=lang==='en'?'Teacher':lang==='zh'?'教师':'Преподаватель';for(const id of ['student','teacher'])document.getElementById(id+'Link').href='?role='+id+'&lang='+lang;document.title=lang==='en'?'Ready to sign · RUDN':lang==='zh'?'待签署 · 俄罗斯人民友谊大学':'На подпись · РУДН';}
shell(language.value);language.addEventListener('change',async()=>{await handle.setLocale(language.value);shell(language.value);const url=new URL(location.href);url.searchParams.set('lang',language.value);history.replaceState(null,'',url);});
window.addEventListener('pagehide',()=>handle.flush());
</script></body></html>
