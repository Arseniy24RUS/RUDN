name: Platform diagnostics and safe updates

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'firebase/**'
      - 'firebase.diagnostics-v2.json'
      - 'scripts/*diagnostic*'
      - 'scripts/*platform*'
      - 'scripts/test_personality*.mjs'
      - 'scripts/test_sw_*.mjs'
      - 'tests/*platform*'
      - 'tests/*diagnostic*'
      - '.github/workflows/platform-checks.yml'

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governor-scope:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && ((((github.head_ref == 'codex/governor-map-and-four-terms' && github.event.pull_request.base.sha == '6aee7fe4e31beb4cc4d02a25405a53a2bf2624fd') || ((github.head_ref == 'codex/governor-content-art' && github.event.pull_request.base.sha == 'f2b90e82b2cc652012c9773260a79a22ab62c5d2') || ((github.head_ref == 'codex/governor-advisor-messenger' && github.event.pull_request.base.sha == '980d11ae4b455090b19ac40789f6f6724a638b9a') || ((github.head_ref == 'codex/governor-balance-audit' && github.event.pull_request.base.sha == 'a22983d689cfd50a7649d81b087db50532140942') || (github.head_ref == 'codex/governor-balance-ii' && github.event.pull_request.base.sha == '8353387c35ad40141bd001aec650db284d78f237')))))) || (github.head_ref == 'codex/governor-seminar-scoring' && github.event.pull_request.base.sha == 'e7da48e8af623787598e73cebda113a775ca7347')) && startsWith(github.event.pull_request.title, '[governor-v3-publish] ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify the focused Governor pull request
        env:
          GOVERNOR_BASE: ${{ github.event.pull_request.base.sha }}
          GOVERNOR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY_INNER'
          import os
          import re
          import subprocess

          if re.findall(r'\[[^\]\r\n]+\]', os.environ['GOVERNOR_TITLE']) != ['[governor-v3-publish]']:
              raise SystemExit('Use only the Governor release marker')
          base = os.environ['GOVERNOR_BASE']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--no-renames', '-z', base, 'HEAD'], text=True
          ).rstrip('\0').split('\0')
          allowed = {
              '.github/workflows/deploy-pages.yml',
              '.github/workflows/platform-checks.yml',
              '.github/workflows/legal-lab-checks.yml',
              '.github/workflows/puzzle-checks.yml',
              '.github/workflows/puzzle-map-network.yml',
              'firebase/functions/governor-v3-advisor/provider.mjs',
              'scripts/build-platform-release.mjs',
              'scripts/test-platform-release.mjs',
              'scripts/test_governor_v3_browser.py',
              'scripts/test_governor_v4_browser.py',
                  'scripts/test_governor_service_worker.mjs',
                  'site/service-worker.js',
                  'site/assets/course/previews/seminar_07_simulator.jpg',
              'scripts/test_governor_terra_browser.py',
              'tests/governor-v4-campaign.test.mjs',
              'tests/governor-v4-economy.test.mjs',
              'tests/governor-v4-map.test.mjs',
              'scripts/test_governor_v4_touch_browser.py',
              'tests/governor-v4-major-events.test.mjs',
              'tests/governor-v4-media.test.mjs',
              'tests/governor-v4-negotiation.test.mjs',
              'tests/governor-v4-programmes.test.mjs',
          }
          if base == 'e7da48e8af623787598e73cebda113a775ca7347':
              allowed.add('site/assets/js/main.js')
          if base == 'f2b90e82b2cc652012c9773260a79a22ab62c5d2':
              allowed.update({'site/assets/js/main.js', 'site/assets/css/site.css', '.github/workflows/settlements-replay.yml'})
          if base == '980d11ae4b455090b19ac40789f6f6724a638b9a':
              allowed = {
                  '.github/workflows/deploy-pages.yml',
                  '.github/workflows/legal-lab-checks.yml',
                  '.github/workflows/platform-checks.yml',
                  '.github/workflows/puzzle-checks.yml',
                  '.github/workflows/puzzle-map-network.yml',
                  'firebase/functions/governor-v3-advisor/advisor.test.mjs',
                  'firebase/functions/governor-v3-advisor/provider.mjs',
                  'scripts/test_governor_terra_browser.py',
                  'scripts/test_governor_v4_browser.py',
                  'site/service-worker.js',
                  'tests/governor-v4-major-events.test.mjs',
                  'tests/governor-v4-media.test.mjs',
              }
          if base == 'a22983d689cfd50a7649d81b087db50532140942':
              allowed = {
                  '.github/workflows/deploy-pages.yml',
                  '.github/workflows/legal-lab-checks.yml',
                  '.github/workflows/platform-checks.yml',
                  '.github/workflows/puzzle-checks.yml',
                  '.github/workflows/puzzle-map-network.yml',
                  '.github/workflows/settlements-replay.yml',
                  'firebase/functions/governor-v3-advisor/provider.mjs',
                  'scripts/test_governor_terra_browser.py',
                  'scripts/test_governor_v4_browser.py',
                  'site/assets/js/main.js',
                  'tests/governor-strategy-report.test.mjs',
                  'tests/governor-v4-campaign.test.mjs',
                  'tests/governor-v4-fiscal-savings.test.mjs',
                  'tests/governor-v4-major-events.test.mjs',
                  'tests/governor-v4-negotiation.test.mjs',
              }
          if base == '8353387c35ad40141bd001aec650db284d78f237':
              allowed = {
                  '.github/workflows/deploy-pages.yml',
                  '.github/workflows/legal-lab-checks.yml',
                  '.github/workflows/platform-checks.yml',
                  '.github/workflows/puzzle-checks.yml',
                  '.github/workflows/puzzle-map-network.yml',
                  '.github/workflows/settlements-replay.yml',
                  'scripts/test_governor_v4_browser.py',
                  'site/assets/js/main.js',
                  'tests/governor-strategy-report.test.mjs',
                  'tests/governor-v4-campaign.test.mjs',
                  'tests/governor-v4-fiscal-savings.test.mjs',
                  'tests/governor-v4-major-events.test.mjs',
                  'tests/governor-v4-spatial-demography.test.mjs',
              }
          outside = sorted(path for path in changed if path not in allowed and not path.startswith('site/apps/governor/'))
          if outside or not any(path.startswith('site/apps/governor/') for path in changed):
              raise SystemExit('Invalid Governor-only pull request scope: ' + ', '.join(outside))
          PY_INNER

  contracts:
    needs: governor-scope
    if: ${{ !cancelled() && needs.governor-scope.result == 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix firebase/functions
      - name: Verify the Reception chat and scoring contracts
        run: >-
          node --test firebase/functions/reception-ai/*.test.mjs
          tests/reception-ai-api-client.test.mjs tests/reception-messenger-media.test.mjs
      - name: Verify identity, archives, checkpoints, rollback and immutable releases
        run: >-
          node --test tests/diagnostics-v2.test.mjs tests/diagnostics-cloud-policy.test.mjs
          tests/platform-update-state.test.mjs tests/platform-update-coordinator.test.mjs tests/platform-update-failures.test.mjs
          tests/platform-update-preparation-retry.test.mjs tests/diagnostics-admin-update.test.mjs
          tests/platform-diagnostics-pagination.test.mjs
          scripts/diagnostics-v2-service.test.mjs scripts/diagnostics-v2-cli-adapter.test.mjs scripts/test-platform-release.mjs
          scripts/test-platform-release-worker.mjs scripts/test_governor_service_worker.mjs scripts/test_sw_client_bindings.mjs scripts/test_sw_durable_prepare.mjs
      - name: Verify the personality scoring key and team-role interpretation
        run: |
          node scripts/test_personality_model.mjs
          node scripts/test_personality_insights.mjs

  firebase:
    needs: governor-scope
    if: ${{ !cancelled() && needs.governor-scope.result == 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --prefix firebase/functions
      - name: Verify archive authorization, idempotence, indexing and deletion fences
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: >-
          npx --yes firebase-tools@15.30.1 emulators:exec
          --project demo-rudn --config firebase.diagnostics-v2.json --only auth,database,functions
          "node --test --test-force-exit scripts/diagnostics-v2-emulator.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-emulator
          path: '*-debug.log'
          retention-days: 14

  browsers:
    needs: governor-scope
    if: ${{ !cancelled() && needs.governor-scope.result == 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build:firebase && npm run build:career
      - run: python -m pip install playwright==1.61.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Play a Governor campaign in the browser
        run: >-
          python scripts/test_governor_v3_browser.py --engine '${{ matrix.browser }}'
          --output "${{ runner.temp }}/governor-${{ matrix.browser }}"
      - name: Verify automatic diagnostics and restore in real browser engines
        env:
          RELEASE_BROWSERS: ${{ matrix.browser }}
          DIAGNOSTICS_BROWSERS: ${{ matrix.browser }}
          QA_OUT: ${{ runner.temp }}/release-${{ matrix.browser }}
          DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/diagnostics-${{ matrix.browser }}
        run: |
          export PLAYWRIGHT_MODULE_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          export PLAYWRIGHT_PATH="$PLAYWRIGHT_MODULE_PATH"
          node scripts/test_personality_ui.mjs --browser '${{ matrix.browser }}' --output '${{ runner.temp }}/personality-${{ matrix.browser }}'
          node scripts/diagnostics-v2-browser.mjs
          node scripts/test-platform-release-browser.mjs
          QA_OUT="${{ runner.temp }}/boot-rollback-${{ matrix.browser }}" node scripts/test-platform-boot-rollback.mjs
          node scripts/platform-update-adapters-transport.mjs --browser '${{ matrix.browser }}' --output '${{ runner.temp }}/transport-${{ matrix.browser }}'
          trace_args=()
          if [ '${{ matrix.browser }}' = 'webkit' ]; then trace_args+=(--trace-runtime); fi
          node scripts/platform-update-adapters.mjs --browser '${{ matrix.browser }}' --output '${{ runner.temp }}/adapters-${{ matrix.browser }}' "${trace_args[@]}"
          node scripts/platform-update-adapters-lifecycle.mjs --browser '${{ matrix.browser }}' --output '${{ runner.temp }}/lifecycle-${{ matrix.browser }}'
          node scripts/platform-update-adapters-loader-retry.mjs --browser '${{ matrix.browser }}' --output '${{ runner.temp }}/loader-retry-${{ matrix.browser }}'
          node scripts/platform-update-adapters-diagnostics.mjs --browser '${{ matrix.browser }}' --output '${{ runner.temp }}/standalone-diagnostics-${{ matrix.browser }}'
          node scripts/platform-shell-updates.mjs --browser '${{ matrix.browser }}' --output '${{ runner.temp }}/shell-${{ matrix.browser }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/release-${{ matrix.browser }}
            ${{ runner.temp }}/boot-rollback-${{ matrix.browser }}
            ${{ runner.temp }}/diagnostics-${{ matrix.browser }}
            ${{ runner.temp }}/personality-${{ matrix.browser }}
            ${{ runner.temp }}/adapters-${{ matrix.browser }}
            ${{ runner.temp }}/transport-${{ matrix.browser }}
            ${{ runner.temp }}/lifecycle-${{ matrix.browser }}
            ${{ runner.temp }}/loader-retry-${{ matrix.browser }}
            ${{ runner.temp }}/standalone-diagnostics-${{ matrix.browser }}
            ${{ runner.temp }}/shell-${{ matrix.browser }}
            ${{ runner.temp }}/governor-${{ matrix.browser }}
          retention-days: 30
