name: Puzzle browser and catalog checks

on:
  workflow_call:
    inputs:
      coverage:
        description: 'full or smoke'
        type: string
        default: full
  pull_request:
    paths:
      - 'site/apps/puzzle.html'
      - 'site/apps/governor/**'
      - 'site/apps/reception/**'
      - 'site/apps/career/**'
      - 'site/assets/js/main.js'
      - 'site/assets/js/games-catalog.js'
      - 'site/assets/js/i18n.js'
      - 'site/index.html'
      - 'scripts/test_free_module*'
      - 'scripts/test_games_platform*'
      - 'site/assets/js/puzzle-*.js'
      - 'site/assets/js/backend.js'
      - 'site/assets/js/durable-store.js'
      - 'site/assets/css/puzzle.css'
      - 'site/assets/puzzle/**'
      - 'site/service-worker.js'
      - 'scripts/*puzzle*'
      - '.github/workflows/puzzle-checks.yml'
  workflow_dispatch:
    inputs:
      coverage:
        description: 'Full: complete application catalog, all difficulties and engines. Smoke: representative maps.'
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

concurrency:
  group: puzzle-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all local and remote maps
        run: python scripts/prepare_puzzle_catalog.py --output "${{ runner.temp }}/puzzle-qa" --workers 8
      - id: matrix
        shell: bash
        run: |
          if [[ '${{ inputs.coverage || 'full' }}' == 'full' ]]; then
            echo 'shards=["1/6","2/6","3/6","4/6","5/6","6/6"]' >> "$GITHUB_OUTPUT"
          else
            echo 'shards=["1/1"]' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-audited-catalog
          path: ${{ runner.temp }}/puzzle-qa
          retention-days: 7

  browsers:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: ${{ fromJSON(needs.catalog.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-audited-catalog
          path: ${{ runner.temp }}/puzzle-qa
      - name: Prepare the real runtime and browser
        run: |
          npm ci --ignore-scripts
          npm run build:firebase
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Complete maps and verify responsive layouts
        shell: bash
        run: |
          puzzle_extra=()
          if [[ '${{ inputs.coverage || 'full' }}' != 'full' ]]; then
            puzzle_extra+=(--maps russia-subjects,world-countries,municipal-274048,municipal-144764,adm1-MCO,adm1-USA,adm1-IDN)
          fi
          python scripts/test_puzzle_catalog.py --output "${{ runner.temp }}/puzzle-qa" --browsers "${{ matrix.browser }}" --shard "${{ matrix.shard }}" --workers 2 "${puzzle_extra[@]}"
      - name: Verify every map in English and Chinese at all twelve sizes
        if: inputs.coverage != 'smoke'
        run: python scripts/test_puzzle_locale_layout.py --output "${{ runner.temp }}/puzzle-qa" --browsers "${{ matrix.browser }}" --shard "${{ matrix.shard }}" --workers 1
      - name: Artifact name
        if: always()
        id: artifact
        shell: bash
        run: echo "shard=$(echo '${{ matrix.shard }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-${{ matrix.browser }}-${{ steps.artifact.outputs.shard }}
          path: |
            ${{ runner.temp }}/puzzle-qa/*.json
            ${{ runner.temp }}/puzzle-qa/*.jsonl
            ${{ runner.temp }}/puzzle-qa/screenshots
            ${{ runner.temp }}/puzzle-qa/failures
          retention-days: 14

  complete-matrix:
    if: always()
    needs: [catalog, browsers, storage, interactions, games-and-rendering, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: puzzle-*
          path: ${{ runner.temp }}/puzzle-matrix
      - name: Verify every required case ran and passed
        env:
          MATRIX_COVERAGE: ${{ inputs.coverage || 'full' }}
        run: |
          python scripts/test_puzzle_report.py --artifacts "${{ runner.temp }}/puzzle-matrix" --coverage "$MATRIX_COVERAGE"
      - name: Verify every localized layout even when another suite failed
        if: always() && inputs.coverage != 'smoke'
        run: python scripts/test_puzzle_locale_report.py --artifacts "${{ runner.temp }}/puzzle-matrix"
      - name: Require all independent quality gates
        if: always()
        run: |
          test "${{ needs.catalog.result }}" = success
          test "${{ needs.browsers.result }}" = success
          test "${{ needs.storage.result }}" = success
          test "${{ needs.interactions.result }}" = success
          test "${{ needs.games-and-rendering.result }}" = success
          test "${{ needs.performance.result }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-matrix-summary
          path: |
            ${{ runner.temp }}/puzzle-matrix/puzzle-matrix-summary.json
            ${{ runner.temp }}/puzzle-matrix/localized-layout-summary.json

  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser and Firebase fixture runtime
        run: |
          npm ci --ignore-scripts
          npm run build:firebase
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Diagnose native offline navigation separately from application behavior
        run: python scripts/test_puzzle_offline_probe.py --output "${{ runner.temp }}/puzzle-offline-probe.json"
      - name: Verify local storage and tab ownership
        shell: bash
        env:
          PUZZLE_STORAGE_BROWSERS: chromium
        run: |
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node --test scripts/puzzle_storage_order_test.mjs
          node --test scripts/puzzle_identity_leaderboard_test.mjs
          node scripts/puzzle_storage_test.mjs
          DURABLE_TEST_BROWSERS=chromium,firefox,webkit QA_OUT="${{ runner.temp }}/puzzle-storage-recovery" node scripts/puzzle_storage_recovery_test.mjs
      - name: Verify immutable results and retry against Firebase emulators
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-rudn --config firebase.puzzle.json --only auth,database "node scripts/puzzle_storage_emulator_test.mjs"
      - name: Verify roster identity migration without production data
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-rudn --config firebase.identity.json --only auth,database "node --test scripts/test_roster_migration.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-offline-driver-report
          path: |
            ${{ runner.temp }}/puzzle-offline-probe.json
            ${{ runner.temp }}/puzzle-storage-recovery/completion-recovery.json

  interactions:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-audited-catalog
          path: ${{ runner.temp }}/puzzle-interactions
      - name: Prepare runtime and browser
        run: |
          npm ci --ignore-scripts
          npm run build:firebase
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Verify actual controls, locales, fullscreen and competing tabs
        run: python scripts/test_puzzle_interactions.py --output "${{ runner.temp }}/puzzle-interactions" --browsers "${{ matrix.browser }}"
      - name: Verify network faults, unavailable storage, old drafts and worker upgrades
        run: python scripts/test_puzzle_resilience.py --output "${{ runner.temp }}/puzzle-interactions" --browsers "${{ matrix.browser }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-interactions-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/puzzle-interactions/interactions*.json*
            ${{ runner.temp }}/puzzle-interactions/resilience*.json*
            ${{ runner.temp }}/puzzle-interactions/failures
          retention-days: 14

  games-and-rendering:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-audited-catalog
          path: ${{ runner.temp }}/games-qa
      - name: Prepare isolated browser runtime
        run: |
          npm ci --ignore-scripts
          npm run build:firebase
          npm run build:career
          python -m pip install playwright==1.61.0 openpyxl==3.1.5
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Verify geometry, free contexts and independent XLSX parsing
        env:
          QA_OUT: ${{ runner.temp }}/games-qa
        run: |
          node --test scripts/test_free_module_contracts.mjs scripts/test_puzzle_leaderboard.mjs scripts/puzzle_snap_test.mjs scripts/puzzle_raster_schedule_test.mjs
          node scripts/test_puzzle_render_geometry.cjs
          python scripts/test_puzzle_xlsx.py --artifacts "${{ runner.temp }}/games-qa"
      - name: Verify actual mobile geometry and rotation in all languages
        run: python scripts/test_puzzle_render_browser.py --fixtures "${{ runner.temp }}/games-qa" --output "${{ runner.temp }}/games-qa/render" --browsers "${{ matrix.browser }}" --dpr-checks
      - name: Diagnose native WebKit raster phases with deterministic attempts
        if: always() && matrix.browser == 'webkit'
        run: python scripts/test_puzzle_native_diagnostic.py --fixtures "${{ runner.temp }}/games-qa" --output "${{ runner.temp }}/games-qa/native-raster"
      - name: Verify exact worker pixels, bounded memory and cancellation
        run: python scripts/test_puzzle_raster_worker.py --fixtures "${{ runner.temp }}/games-qa" --output "${{ runner.temp }}/games-qa/raster-worker" --browsers "${{ matrix.browser }}"
      - name: Verify free module UI and unchanged course attempts
        env:
          DURABLE_TEST_BROWSERS: ${{ matrix.browser }}
        run: |
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node scripts/test_free_module_contexts.mjs
          node scripts/test_games_platform.mjs
      - name: Recover native puzzle loading and cancel stale route loads
        run: python scripts/test_puzzle_native_load.py --fixtures "${{ runner.temp }}/games-qa" --output "${{ runner.temp }}/games-qa/native-loader" --browsers "${{ matrix.browser }}"
      - name: Reopen the real platform puzzle with cached course data offline
        if: matrix.browser != 'webkit'
        run: python scripts/test_puzzle_native_offline.py --output "${{ runner.temp }}/games-qa/native-offline" --browsers "${{ matrix.browser }}"
      - name: Restore actual 1.3.6 attempts after the new worker activates
        if: matrix.browser == 'chromium'
        run: python scripts/test_puzzle_release_upgrade.py --fixtures "${{ runner.temp }}/games-qa" --output "${{ runner.temp }}/games-qa/upgrade"
      - name: Preserve puzzle progress and completed results after retiring mistake counters
        if: matrix.browser == 'chromium'
        run: python scripts/test_puzzle_no_mistakes.py --output "${{ runner.temp }}/games-qa/no-mistakes"
      - name: Verify student completion through Firebase to visible leaderboard and XLSX
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-rudn --config firebase.puzzle.json --only auth,database "python scripts/test_puzzle_leaderboard_emulator.py --browsers ${{ matrix.browser }} --output ${{ runner.temp }}/games-qa/leaderboard"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-render-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/games-qa/render
            ${{ runner.temp }}/games-qa/native-raster
            ${{ runner.temp }}/games-qa/raster-worker
            ${{ runner.temp }}/games-qa/leaderboard
            ${{ runner.temp }}/games-qa/upgrade
            ${{ runner.temp }}/games-qa/no-mistakes
            ${{ runner.temp }}/games-qa/native-loader
            ${{ runner.temp }}/games-qa/native-offline
            ${{ runner.temp }}/games-qa/*.json
            ${{ runner.temp }}/games-qa/*.xlsx
          retention-days: 14

  performance:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-audited-catalog
          path: ${{ runner.temp }}/performance-qa
      - name: Prepare runtime
        run: |
          npm ci --ignore-scripts
          npm run build:firebase
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Measure actual drawing, frame intervals, long tasks and memory at CPU x1/x4/x6
        run: |
          python scripts/test_puzzle_performance_budget.py
          python scripts/test_puzzle_performance.py --output "${{ runner.temp }}/performance-qa" --channels chromium --cycles 3 --cpu-rates 1,4,6 --enforce-budgets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-render-performance
          path: ${{ runner.temp }}/performance-qa/desktop-performance.json
          retention-days: 14
