          node scripts/check-reception-control-workflow.mjs --out "${{ runner.temp }}/reception-workspace-qa/execution-coverage.json"
          node scripts/build-reception-reader-translations.mjs --check
          node --test firebase/functions/reception-ai/*.test.mjs tests/reception-ai-api-client.test.mjs tests/reception-messenger-media.test.mjs tests/reception-software-motion.test.mjs tests/reception-workbench.test.mjs tests/reception-session-storage.test.mjs tests/reception-ai-qa-cases.test.mjs tests/reception-learning-review.test.mjs tests/reception-authority-picker.test.mjs tests/reception-workbook-view.test.mjs tests/reception-game-copy.test.mjs tests/reception-correspondence-editor.test.mjs tests/reception-control-workspace.test.mjs scripts/check-reception-correspondence-catalog.test.mjs
      - name: Verify Reception document and calendar workflow
        if: contains(github.event.head_commit.message, '[reception-ai-release]')
        run: |
          npm install --prefix "${{ runner.temp }}/reception-dom-tools" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
          node scripts/test-reception-workbench-dom.mjs --jsdom "${{ runner.temp }}/reception-dom-tools/node_modules/jsdom/lib/api.js"
          node scripts/test-reception-correspondence-dom.mjs --jsdom "${{ runner.temp }}/reception-dom-tools/node_modules/jsdom/lib/api.js" --out "${{ runner.temp }}/reception-workspace-qa/correspondence-dom"
          node scripts/test-reception-correspondence-dom.mjs --context seminar --jsdom "${{ runner.temp }}/reception-dom-tools/node_modules/jsdom/lib/api.js" --out "${{ runner.temp }}/reception-workspace-qa/correspondence-dom-seminar"
          node scripts/test-reception-execution-dom.mjs --jsdom "${{ runner.temp }}/reception-dom-tools/node_modules/jsdom/lib/api.js" --out "${{ runner.temp }}/reception-workspace-qa/execution-dom"
      - name: Verify Reception mobile workspace in Chromium and WebKit
        if: contains(github.event.head_commit.message, '[reception-ai-release]')
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium webkit
          export RECEPTION_PLAYWRIGHT_MODULE="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          node scripts/reception-ai-qa-cases.mjs --out "${{ runner.temp }}/reception-synthetic-cases"
          node scripts/test-reception-actor-browser.mjs --cases "${{ runner.temp }}/reception-synthetic-cases" --out "${{ runner.temp }}/reception-workspace-qa/c03"
          node scripts/test-reception-ai-mentor-chat-browser.mjs --cases "${{ runner.temp }}/reception-synthetic-cases" --out "${{ runner.temp }}/reception-workspace-qa/mentor-chat"
          node scripts/test-reception-ai-workspace-browser.mjs --cases "${{ runner.temp }}/reception-synthetic-cases" --browser chromium --out "${{ runner.temp }}/reception-workspace-qa/chromium"
          node scripts/test-reception-ai-workspace-browser.mjs --cases "${{ runner.temp }}/reception-synthetic-cases" --browser webkit --out "${{ runner.temp }}/reception-workspace-qa/webkit"
          node scripts/test-reception-source-search-browser.mjs --browser chromium --out "${{ runner.temp }}/reception-workspace-qa/source-search-chromium"
          node scripts/test-reception-source-search-browser.mjs --browser webkit --out "${{ runner.temp }}/reception-workspace-qa/source-search-webkit"
          node scripts/test-reception-correspondence-browser.mjs --browser chromium --out "${{ runner.temp }}/reception-workspace-qa/correspondence-chromium"
          node scripts/test-reception-correspondence-browser.mjs --browser webkit --out "${{ runner.temp }}/reception-workspace-qa/correspondence-webkit"
          node scripts/test-reception-execution-browser.mjs --browser chromium --out "${{ runner.temp }}/reception-workspace-qa/execution-chromium"
          node scripts/test-reception-execution-browser.mjs --browser webkit --out "${{ runner.temp }}/reception-workspace-qa/execution-webkit"
      - name: Retain Reception mobile workspace evidence
        if: always() && contains(github.event.head_commit.message, '[reception-ai-release]')
        uses: actions/upload-artifact@v4
        with:
          name: reception-workspace-qa
          path: ${{ runner.temp }}/reception-workspace-qa
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify the shared Legal Lab reader
        if: env.RECEPTION_LEGAL_READER == 'true' && !contains(github.event.head_commit.message, '[reception-ai-release]')
        run: node --test tests/legal-lab-reader-data.test.mjs tests/legal-lab-reader-tools.test.mjs
      - name: Verify actual immutable main and module routes
        if: env.CAREER_VERIFIED_PUBLISH != 'true' && env.COURSE_RESULT_RECOVERY != 'true' && !contains(github.event.head_commit.message, '[reception-ai-release]') && env.GOVERNOR_V3_PUBLISH != 'true'
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
          export PLAYWRIGHT_MODULE_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          kind=modules
          if [ "$RECEPTION_LEGAL_READER" = 'true' ]; then kind=reception-reader; fi
          node scripts/platform-main-staging.mjs --a "${{ runner.temp }}/platform-staging" --b "${{ runner.temp }}/platform-staging" --kind "$kind" --browser chromium --output "${{ runner.temp }}/platform-main-staging"
      - name: Retain immutable main smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-main-staging
          path: ${{ runner.temp }}/platform-main-staging
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive verified staging and checksum
        id: release_archive
        run: node scripts/archive-platform-release.mjs --site "${{ runner.temp }}/platform-staging" --out "${{ runner.temp }}/platform-release-archive"
      - name: Retain the exact baseline for recovery
        uses: actions/upload-artifact@v4
        with:
          name: platform-release-${{ steps.release_archive.outputs.build_id }}
          path: ${{ runner.temp }}/platform-release-archive
          if-no-files-found: error
          retention-days: 90
      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.verification_only == false) }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ steps.release_archive.outputs.build_id }}
          path: ${{ runner.temp }}/platform-staging

  publish-pages:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.verification_only == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified immutable staging
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ needs.deploy.outputs.build_id }}

  retain-successful-release:
    needs: [deploy, publish-pages]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.publish-pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download only the successfully deployed exact archive
        uses: actions/download-artifact@v4
        with:
          name: platform-release-${{ needs.deploy.outputs.build_id }}
          path: release-archive
      - name: Verify and retain the immutable GitHub Release archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ needs.deploy.outputs.build_id }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-archive
          sha256sum --check "platform-release-${BUILD_ID}.tar.gz.sha256"
          tag="platform-release-${BUILD_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern receipt.json --dir existing
            node -e 'const fs=require("fs");const old=JSON.parse(fs.readFileSync("existing/receipt.json"));if(old.buildId!==process.env.BUILD_ID||old.status!=="pass")process.exit(1);'
          else
            gh release create "$tag" "${tag}.tar.gz" "${tag}.tar.gz.sha256" receipt.json --target "$TARGET_SHA" --title "Platform ${BUILD_ID}" --notes "Exact verified GitHub Pages deployment. Runtime, immutable resources and checksums retained for baseline recovery."
          fi

