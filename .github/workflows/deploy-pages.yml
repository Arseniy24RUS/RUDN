name: Deploy RUDN learning platform to GitHub Pages

on:
  # RUDN_RECEPTION_CALENDAR_SCHEDULE
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_only:
        description: Build, verify and archive without publishing Pages or a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (inputs.verification_only == true && github.ref) || 'production' }}
  cancel-in-progress: true

jobs:
  preserve-legacy-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout baseline preservation tools
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/preserve-legacy-baseline.mjs
            scripts/download-release-baseline.mjs
          sparse-checkout-cone-mode: false
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify the reviewed first-migration ZIP or an existing backup
        id: preserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preserve-legacy-baseline.mjs --out "${{ runner.temp }}/platform-legacy-baseline-backup" --repo "${{ github.repository }}" --run-id "${{ github.run_id }}"
      - name: Retain the reviewed first-migration baseline without replacing it
        if: steps.preserve.outputs.upload_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.preserve.outputs.artifact_name }}
          path: ${{ steps.preserve.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  platform-checks:
    uses: ./.github/workflows/platform-checks.yml

  legal-lab:
    uses: ./.github/workflows/legal-lab-checks.yml

  puzzle-checks:
    if: ${{ !(contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]') || contains(github.event.head_commit.message, '[firebase-transport-only]') || contains(github.event.head_commit.message, '[settlements-grade-hotfix]') || contains(github.event.head_commit.message, '[settlements-network]') || contains(github.event.head_commit.message, '[settlements-road-routes]') || contains(github.event.head_commit.message, '[settlements-towers]') || contains(github.event.head_commit.message, '[settlements-boundaries]') || contains(github.event.head_commit.message, '[settlements-tower-batch]') || contains(github.event.head_commit.message, '[settlements-runtime-cache]') || contains(github.event.head_commit.message, '[settlements-route-limits]')) }}
    uses: ./.github/workflows/puzzle-checks.yml
    with:
      coverage: full

  deploy:
    needs: [preserve-legacy-baseline, puzzle-checks, legal-lab, platform-checks]
    if: ${{ !cancelled() && needs.preserve-legacy-baseline.result == 'success' && needs.legal-lab.result == 'success' && needs.platform-checks.result == 'success' && (needs.puzzle-checks.result == 'success' || (needs.puzzle-checks.result == 'skipped' && (contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]') || contains(github.event.head_commit.message, '[firebase-transport-only]') || contains(github.event.head_commit.message, '[settlements-grade-hotfix]') || contains(github.event.head_commit.message, '[settlements-network]') || contains(github.event.head_commit.message, '[settlements-road-routes]') || contains(github.event.head_commit.message, '[settlements-towers]') || contains(github.event.head_commit.message, '[settlements-boundaries]') || contains(github.event.head_commit.message, '[settlements-tower-batch]') || contains(github.event.head_commit.message, '[settlements-runtime-cache]') || contains(github.event.head_commit.message, '[settlements-route-limits]')))) }}
    env:
      FOCUSED_HOTFIX: ${{ contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]') || contains(github.event.head_commit.message, '[firebase-transport-only]') || contains(github.event.head_commit.message, '[settlements-grade-hotfix]') || contains(github.event.head_commit.message, '[settlements-network]') || contains(github.event.head_commit.message, '[settlements-road-routes]') || contains(github.event.head_commit.message, '[settlements-towers]') || contains(github.event.head_commit.message, '[settlements-boundaries]') || contains(github.event.head_commit.message, '[settlements-tower-batch]') || contains(github.event.head_commit.message, '[settlements-runtime-cache]') || contains(github.event.head_commit.message, '[settlements-route-limits]') }}
      SETTLEMENTS_NETWORK: ${{ contains(github.event.head_commit.message, '[settlements-network]') }}
      SETTLEMENTS_ROAD_ROUTES: ${{ contains(github.event.head_commit.message, '[settlements-road-routes]') }}
      SETTLEMENTS_RUNTIME_CACHE: ${{ contains(github.event.head_commit.message, '[settlements-runtime-cache]') }}
      SETTLEMENTS_ROUTE_LIMITS: ${{ contains(github.event.head_commit.message, '[settlements-route-limits]') }}
      SETTLEMENTS_TOWER_BATCH: ${{ contains(github.event.head_commit.message, '[settlements-tower-batch]') }}
      SETTLEMENTS_BOUNDARIES: ${{ contains(github.event.head_commit.message, '[settlements-boundaries]') }}
      SETTLEMENTS_TOWERS: ${{ contains(github.event.head_commit.message, '[settlements-towers]') }}
      SETTLEMENTS_GRADE_HOTFIX: ${{ contains(github.event.head_commit.message, '[settlements-grade-hotfix]') }}
      FIREBASE_TRANSPORT_ONLY: ${{ contains(github.event.head_commit.message, '[firebase-transport-only]') }}
      SETTLEMENTS_UI_ONLY: ${{ contains(github.event.head_commit.message, '[settlements-ui-only]') }}
      VERIFIED_SETTLEMENTS_PUBLISH: ${{ contains(github.event.head_commit.message, '[settlements-ui-only]') && contains(github.event.head_commit.message, '[settlements-verified-publish]') }}
      PUZZLE_NO_MISTAKES_ONLY: ${{ contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') }}
      QUIZ_LAYOUT_ONLY: ${{ contains(github.event.head_commit.message, '[quiz-layout-only]') }}
      GAMES_ACCESS_ONLY: ${{ contains(github.event.head_commit.message, '[games-access-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_id: ${{ steps.release_archive.outputs.build_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Focused hotfixes run checks for their authorized scope.
      # Reject the shortcut if the commit changes anything outside this scope.
      - name: Verify focused hotfix change scope
        if: env.FOCUSED_HOTFIX == 'true'
        run: |
          python - <<'PY'
          import os, subprocess
          games_access = {
            '.github/workflows/deploy-pages.yml',
            'scripts/test_games_access.mjs',
            'site/assets/js/games-catalog.js',
            'site/assets/js/main.js',
            'site/apps/governor/platform-bridge.js',
            'site/service-worker.js',
          }
          quiz_layout = {
            '.github/workflows/deploy-pages.yml',
            'scripts/test_quiz_layout.mjs',
            'site/assets/css/site.css',
            'site/service-worker.js',
          }
          puzzle_no_mistakes = {
            '.github/workflows/deploy-pages.yml',
            '.github/workflows/puzzle-checks.yml',
            'scripts/puzzle_snap_test.mjs',
            'scripts/test_puzzle_catalog.py',
            'scripts/test_puzzle_interactions.py',
            'scripts/test_puzzle_release_upgrade.py',
            'scripts/test_puzzle_resilience.py',
            'scripts/test_puzzle_no_mistakes.py',
            'scripts/test_puzzle_leaderboard.mjs',
            'site/apps/puzzle.html',
            'site/assets/css/puzzle.css',
            'site/assets/js/puzzle-bootstrap.js',
            'site/assets/js/puzzle-engine.js',
            'site/service-worker.js',
            'docs/puzzle-no-mistakes.md',
          }
          settlements_ui = {
            '.github/workflows/deploy-pages.yml',
            'site/apps/settlements/entry.mjs',
            'site/apps/settlements/runtime/assets/js/settlements/v24/game.mjs',
            'site/apps/settlements/source-manifest.json',
            'site/apps/settlements/module.css',
            'site/assets/js/main.js',
            'site/assets/js/settlements-presentation.js',
            'site/assets/css/site.css',
            'scripts/test-settlements-browser.py',
            'scripts/test-settlements-region-switch.py',
            'site/assets/js/settlements-storage.js',
            'scripts/test-settlements-storage.mjs',
            'scripts/test-settlements-save-status-browser.py',
            'site/service-worker.js',
          }
          is_settlements_ui = os.environ['SETTLEMENTS_UI_ONLY'] == 'true'
          allowed = settlements_ui if is_settlements_ui else puzzle_no_mistakes if os.environ['PUZZLE_NO_MISTAKES_ONLY'] == 'true' else quiz_layout if os.environ['QUIZ_LAYOUT_ONLY'] == 'true' else games_access
          if os.environ['FIREBASE_TRANSPORT_ONLY'] == 'true':
            # The owner explicitly authorized skipping full module checks for
            # this reviewed gateway release. Any later product edit rejects it.
            assert subprocess.check_output(['git', 'rev-parse', 'HEAD:site'], text=True).strip() == 'bd0f98ca72f68fdd99a0761def6f65529cb12cb4'
            assert subprocess.check_output(['git', 'rev-parse', 'HEAD:firebase'], text=True).strip() == '22b145ae3fbfcfd048b357cab47ff85b157b49a9'
            allowed = {'.github/workflows/deploy-pages.yml', 'package.json', 'package-lock.json', 'open_rudn_direct.bat', 'scripts/open-rudn-direct.ps1', 'scripts/test-firebase-gateway.mjs'}
            allowed.update(subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD', 'site', 'firebase'], text=True).splitlines())
          if os.environ['SETTLEMENTS_GRADE_HOTFIX'] == 'true':
            # The owner requested urgent publication without the full matrix.
            # Only tutorial/completion presentation and recovery may change; engine rules/data stay fixed.
            allowed = {'.github/workflows/deploy-pages.yml', 'site/apps/settlements/entry.mjs', 'site/apps/settlements/copy.mjs', 'site/apps/settlements/module.css', 'site/service-worker.js', 'scripts/test-settlements-result-browser.py', 'scripts/test-settlements-tutorial-assessment-browser.py', 'scripts/test-settlements-training-gates-browser.py', 'scripts/test-settlements-course-status.mjs', 'scripts/test-settlements-course-recovery.mjs', 'scripts/test-settlements-dashboard-browser.py', 'site/assets/js/settlements-course-status.js', 'site/apps/settlements/runtime/assets/js/settlements/v24/game.mjs', 'site/apps/settlements/runtime/assets/js/settlements/v24/i18n.mjs', 'site/apps/settlements/source-manifest.json', 'site/assets/js/main.js', 'site/assets/js/firebase-gateway.js', 'scripts/test-firebase-gateway.mjs'}
          if os.environ['SETTLEMENTS_ROAD_ROUTES'] == 'true':
            runtime = 'site/apps/settlements/runtime/'
            paths = {'assets/js/settlements/v24/engine.mjs', 'assets/js/settlements/v24/network-routing.mjs', 'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/map.mjs', 'assets/js/settlements/v24/i18n.mjs', 'assets/css/settlements-v24.css'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/source-manifest.json', 'scripts/test-settlements-road-routes.mjs', 'scripts/test-settlements-road-routes-browser.py', 'scripts/audit-settlements-road-routes.mjs'} | {runtime + path for path in paths}
          if os.environ['SETTLEMENTS_NETWORK'] == 'true':
            import json, hashlib, re
            runtime = 'site/apps/settlements/runtime/'
            patched = {'assets/js/settlements/v2/network.mjs', 'assets/js/settlements/v2/data.mjs', 'assets/js/settlements/v24/social-plan-fetch.mjs', 'assets/js/settlements/v24/transport-policy-fetch.mjs', 'assets/js/settlements/v24/federal-cities.mjs'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/entry.mjs', 'site/assets/js/settlements-storage.js', 'site/apps/settlements/source-manifest.json', 'firebase/functions/gateway.mjs', 'firebase/functions/gateway.test.mjs', 'scripts/test-settlements-network.mjs', 'scripts/test-settlements-network-browser.mjs', 'scripts/test-settlements-storage.mjs'} | {runtime + path for path in patched}
            def source(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'])
            previous, current = [json.loads(source(ref, 'site/apps/settlements/source-manifest.json')) for ref in ['HEAD^','HEAD']]
            assert current['sourceHash'] == hashlib.sha256(json.dumps(current['files'], ensure_ascii=False, separators=(',',':')).encode()).hexdigest()
            for entry in current['files']:
              if entry['path'] in patched:
                data = source('HEAD', runtime + entry['path'])
                assert entry['bytes'] == len(data) and entry['sha256'] == hashlib.sha256(data).hexdigest()
            for manifest in [previous,current]:
              manifest.pop('sourceHash')
              manifest['files'] = [entry for entry in manifest['files'] if entry['path'] not in patched]
            assert previous == current, 'Game rules, authored plans and protected geography must stay unchanged'
            def worker_without_network_stamp(ref):
              text = source(ref,'site/service-worker.js').decode()
              text = re.sub(r'^const CACHE=.*?;$','CACHE_STAMP',text,flags=re.M)
              return text.replace("'./apps/settlements/runtime/assets/js/settlements/v2/network.mjs',",'')
            assert worker_without_network_stamp('HEAD^') == worker_without_network_stamp('HEAD'), 'Existing release/geometry cache protections must stay unchanged'
            def firebase_routes(ref):
              return source(ref,'firebase/functions/gateway.mjs').decode().split('export function upstreamFor(',1)[1].split('export async function handle(',1)[0]
            assert firebase_routes('HEAD^') == firebase_routes('HEAD'), 'Firebase authentication/database/storage routes must stay unchanged'
          if os.environ['SETTLEMENTS_TOWERS'] == 'true':
            runtime = 'site/apps/settlements/runtime/'
            paths = {'assets/js/settlements/v24/engine.mjs', 'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/i18n.mjs', 'assets/js/settlements/v24/map.mjs', 'assets/js/settlements/v24/scenarios.mjs', 'assets/js/settlements/v24/telecom-policy.mjs', 'assets/js/settlements/v24/initial-tower-spacing.mjs', 'assets/js/settlements/v24/tower-lod.mjs'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/source-manifest.json', 'scripts/test-settlements-road-routes.mjs', 'scripts/test-settlements-initial-spacing.mjs', 'scripts/test-settlements-tower-lod.mjs', 'scripts/test-settlements-tower-saves.mjs', 'scripts/test-settlements-tower-spacing-browser.py', 'scripts/audit-settlements-tower-spacing.mjs'} | {runtime + path for path in paths}
          if os.environ['SETTLEMENTS_BOUNDARIES'] == 'true':
            runtime = 'site/apps/settlements/runtime/'
            paths = {'assets/js/settlements/v24/engine.mjs', 'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/map.mjs', 'assets/js/settlements/v24/region-playability.mjs'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/source-manifest.json', 'scripts/test-settlements-boundaries.mjs', 'scripts/test-settlements-boundary-map.mjs', 'scripts/test-settlements-boundaries-browser.py', 'scripts/audit-settlements-boundaries.mjs'} | {runtime + path for path in paths}
          if os.environ['SETTLEMENTS_TOWER_BATCH'] == 'true':
            runtime = 'site/apps/settlements/runtime/'
            paths = {'assets/js/settlements/v24/engine.mjs', 'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/map.mjs', 'assets/js/settlements/v24/i18n.mjs', 'assets/css/settlements-v24.css'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/source-manifest.json', 'scripts/test-settlements-tower-batch.mjs', 'scripts/test-settlements-tower-batch-map.mjs', 'scripts/test-settlements-tower-batch-browser.py'} | {runtime + path for path in paths}
          if os.environ['SETTLEMENTS_RUNTIME_CACHE'] == 'true':
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'scripts/test_governor_service_worker.mjs'}
          if os.environ['SETTLEMENTS_ROUTE_LIMITS'] == 'true':
            runtime = 'site/apps/settlements/runtime/'
            paths = {'assets/js/settlements/v24/engine.mjs', 'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/i18n.mjs'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/source-manifest.json', 'scripts/test-settlements-route-limits.mjs', 'scripts/test-settlements-route-limits-browser.py', 'scripts/test-settlements-road-routes.mjs', 'scripts/test-settlements-boundaries.mjs'} | {runtime + path for path in paths}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines())
          assert changed and changed <= allowed, f'Change outside the focused hotfix scope: {sorted(changed - allowed)}'
          if os.environ['SETTLEMENTS_GRADE_HOTFIX'] == 'true':
            import re, json, hashlib
            def content(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}']).decode()
            game_path = 'site/apps/settlements/runtime/assets/js/settlements/v24/game.mjs'
            def game_logic(text):
              for start, end in [('render', 'settlementCard'), ('menu', 'regions')]:
                text, count = re.subn(r'(?ms)^  function '+start+r'\(.*?(?=^  function '+end+r'\()', '', text)
                assert count == 1
              return text
            assert game_logic(content('HEAD^', game_path)) == game_logic(content('HEAD', game_path)), 'Engine behavior must stay unchanged'
            manifest_path = 'site/apps/settlements/source-manifest.json'
            previous, current = [json.loads(content(ref, manifest_path)) for ref in ['HEAD^', 'HEAD']]
            patched = {'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/i18n.mjs'}
            assert current['sourceHash'] == hashlib.sha256(json.dumps(current['files'],ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
            for entry in current['files']:
              if entry['path'] in patched:
                data = subprocess.check_output(['git','show','HEAD:site/apps/settlements/runtime/'+entry['path']])
                assert entry['bytes'] == len(data) and entry['sha256'] == hashlib.sha256(data).hexdigest()
            for manifest in [previous,current]:
              manifest.pop('sourceHash')
              manifest['files'] = [entry for entry in manifest['files'] if entry['path'] not in patched]
            assert previous == current, 'Protected data and other runtime provenance must stay unchanged'
            def shared_main(text):
              text = re.sub(r"^import .* from './settlements-course-status.js';\n", '', text, flags=re.M)
              for start, end in [('async function renderDashboard', 'const gradeItems='), ('async function renderGradebook', 'function renderMaterials')]:
                text, count = re.subn(r'(?ms)^'+start+r'\(.*?(?=^'+end+r')', '', text)
                assert count == 1
              return text
            assert shared_main(content('HEAD^','site/assets/js/main.js')) == shared_main(content('HEAD','site/assets/js/main.js')), 'Only settlement result presentation/recovery may change in main'
          if os.environ['SETTLEMENTS_ROAD_ROUTES'] == 'true':
            import json, hashlib, re
            runtime = 'site/apps/settlements/runtime/'
            patched = {'assets/js/settlements/v24/engine.mjs', 'assets/js/settlements/v24/network-routing.mjs', 'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/map.mjs', 'assets/js/settlements/v24/i18n.mjs', 'assets/css/settlements-v24.css'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/source-manifest.json', 'scripts/test-settlements-road-routes.mjs', 'scripts/test-settlements-road-routes-browser.py', 'scripts/audit-settlements-road-routes.mjs'} | {runtime + path for path in patched}
            changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines())
            assert changed and changed <= allowed, f'Change outside road/routes scope: {sorted(changed - allowed)}'
            def source_bytes(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'])
            manifests = [json.loads(source_bytes(ref, 'site/apps/settlements/source-manifest.json')) for ref in ['HEAD^', 'HEAD']]
            current = manifests[1]
            assert current['sourceHash'] == hashlib.sha256(json.dumps(current['files'], ensure_ascii=False, separators=(',', ':')).encode()).hexdigest()
            for entry in current['files']:
              if entry['path'] in patched:
                data = source_bytes('HEAD', runtime + entry['path'])
                assert entry['bytes'] == len(data) and entry['sha256'] == hashlib.sha256(data).hexdigest()
            for manifest in manifests:
              manifest.pop('sourceHash')
              manifest['files'] = [entry for entry in manifest['files'] if entry['path'] not in patched]
            assert manifests[0] == manifests[1], 'Scenario plans, geography and unrelated runtime files must stay unchanged'
            def worker_without_stamp(ref):
              text = source_bytes(ref, 'site/service-worker.js').decode()
              text, count = re.subn(r'^const CACHE=`\$\{CACHE_PREFIX\}[A-Za-z0-9._-]+`;$', 'const CACHE=RELEASE_STAMP;', text, flags=re.M)
              assert count == 1
              return text
            assert worker_without_stamp('HEAD^') == worker_without_stamp('HEAD'), 'Only the service-worker release stamp may change'
          if os.environ['SETTLEMENTS_TOWERS'] == 'true':
            import json, hashlib, re
            runtime = 'site/apps/settlements/runtime/'
            patched = {'assets/js/settlements/v24/engine.mjs', 'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/i18n.mjs', 'assets/js/settlements/v24/map.mjs', 'assets/js/settlements/v24/scenarios.mjs', 'assets/js/settlements/v24/telecom-policy.mjs', 'assets/js/settlements/v24/initial-tower-spacing.mjs', 'assets/js/settlements/v24/tower-lod.mjs'}
            def source_bytes(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'])
            manifests = [json.loads(source_bytes(ref, 'site/apps/settlements/source-manifest.json')) for ref in ['HEAD^', 'HEAD']]
            current = manifests[1]
            assert current['sourceHash'] == hashlib.sha256(json.dumps(current['files'], ensure_ascii=False, separators=(',', ':')).encode()).hexdigest()
            for entry in current['files']:
              if entry['path'] in patched:
                data = source_bytes('HEAD', runtime + entry['path'])
                assert entry['bytes'] == len(data) and entry['sha256'] == hashlib.sha256(data).hexdigest()
            for manifest in manifests:
              manifest.pop('sourceHash')
              manifest['files'] = [entry for entry in manifest['files'] if entry['path'] not in patched]
            assert manifests[0] == manifests[1], 'Scenario plans, geography and unrelated runtime files must stay unchanged'
            def worker_without_stamp(ref):
              text = source_bytes(ref, 'site/service-worker.js').decode()
              text, count = re.subn(r'^const CACHE=`\$\{CACHE_PREFIX\}[A-Za-z0-9._-]+`;$', 'const CACHE=RELEASE_STAMP;', text, flags=re.M)
              assert count == 1
              return text
            assert worker_without_stamp('HEAD^') == worker_without_stamp('HEAD'), 'Only the service-worker release stamp may change'
            path = 'scripts/test-settlements-road-routes.mjs'
            before, after = [source_bytes(ref, path).decode() for ref in ['HEAD^', 'HEAD']]
            assert after.replace("difficulty,initialTowerPolicyVersion:null}", "difficulty}") == before, 'Legacy fixture hashes and assertions must stay unchanged'
          if os.environ['SETTLEMENTS_BOUNDARIES'] == 'true':
            import json, hashlib, re
            runtime = 'site/apps/settlements/runtime/'
