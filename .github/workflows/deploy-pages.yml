name: Deploy RUDN learning platform to GitHub Pages

on:
  # RUDN_RECEPTION_CALENDAR_SCHEDULE
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  puzzle-checks:
    if: ${{ !(contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]')) }}
    uses: ./.github/workflows/puzzle-checks.yml
    with:
      coverage: full

  deploy:
    needs: puzzle-checks
    if: ${{ !cancelled() && (needs.puzzle-checks.result == 'success' || (needs.puzzle-checks.result == 'skipped' && (contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]')))) }}
    env:
      FOCUSED_HOTFIX: ${{ contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]') }}
      SETTLEMENTS_UI_ONLY: ${{ contains(github.event.head_commit.message, '[settlements-ui-only]') }}
      VERIFIED_SETTLEMENTS_PUBLISH: ${{ contains(github.event.head_commit.message, '[settlements-ui-only]') && contains(github.event.head_commit.message, '[settlements-verified-publish]') }}
      PUZZLE_NO_MISTAKES_ONLY: ${{ contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') }}
      QUIZ_LAYOUT_ONLY: ${{ contains(github.event.head_commit.message, '[quiz-layout-only]') }}
      GAMES_ACCESS_ONLY: ${{ contains(github.event.head_commit.message, '[games-access-only]') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Focused UI hotfixes run their own checks instead of every map.
      # Reject the shortcut if the commit changes anything outside this scope.
      - name: Verify focused hotfix change scope
        if: env.FOCUSED_HOTFIX == 'true'
        run: |
          python - <<'PY'
          import os, subprocess
          games_access = {
            '.github/workflows/deploy-pages.yml',
            'scripts/test_games_access.mjs',
            'site/assets/js/games-catalog.js',
            'site/assets/js/main.js',
            'site/apps/governor/platform-bridge.js',
            'site/service-worker.js',
          }
          quiz_layout = {
            '.github/workflows/deploy-pages.yml',
            'scripts/test_quiz_layout.mjs',
            'site/assets/css/site.css',
            'site/service-worker.js',
          }
          puzzle_no_mistakes = {
            '.github/workflows/deploy-pages.yml',
            '.github/workflows/puzzle-checks.yml',
            'scripts/puzzle_snap_test.mjs',
            'scripts/test_puzzle_catalog.py',
            'scripts/test_puzzle_interactions.py',
            'scripts/test_puzzle_release_upgrade.py',
            'scripts/test_puzzle_resilience.py',
            'scripts/test_puzzle_no_mistakes.py',
            'scripts/test_puzzle_leaderboard.mjs',
            'site/apps/puzzle.html',
            'site/assets/css/puzzle.css',
            'site/assets/js/puzzle-bootstrap.js',
            'site/assets/js/puzzle-engine.js',
            'site/service-worker.js',
            'docs/puzzle-no-mistakes.md',
          }
          settlements_ui = {
            '.github/workflows/deploy-pages.yml',
            'site/apps/settlements/entry.mjs',
            'site/apps/settlements/runtime/assets/js/settlements/v24/game.mjs',
            'site/apps/settlements/source-manifest.json',
            'site/apps/settlements/module.css',
            'site/assets/js/main.js',
            'site/assets/js/settlements-presentation.js',
            'site/assets/css/site.css',
            'scripts/test-settlements-browser.py',
            'scripts/test-settlements-region-switch.py',
            'site/assets/js/settlements-storage.js',
            'scripts/test-settlements-storage.mjs',
            'scripts/test-settlements-save-status-browser.py',
            'site/service-worker.js',
          }
          is_settlements_ui = os.environ['SETTLEMENTS_UI_ONLY'] == 'true'
          allowed = settlements_ui if is_settlements_ui else puzzle_no_mistakes if os.environ['PUZZLE_NO_MISTAKES_ONLY'] == 'true' else quiz_layout if os.environ['QUIZ_LAYOUT_ONLY'] == 'true' else games_access
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines())
          assert changed and changed <= allowed, f'Change outside the focused hotfix scope: {sorted(changed - allowed)}'
          if os.environ['VERIFIED_SETTLEMENTS_PUBLISH'] == 'true':
            # One already-reviewed product tree: fresh native matrix, emulator,
            # local save regression and WebKit evidence exist for these bytes.
            # Any product edit rejects this publication path. Normal runs retain
            # every browser check, including the repaired test fixtures below.
            assert is_settlements_ui
            parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
            assert parent == '7bd796f60279b10799df1f1dd2d21243362d5376', 'Verified publication is limited to this reviewed follow-up'
            tree = subprocess.check_output(['git', 'rev-parse', 'HEAD:site'], text=True).strip()
            assert tree == '930ce0dffd80c9f1ab053f26cc4165d128dd638a', 'Verified publication requires the exact reviewed site tree'
          if is_settlements_ui and 'site/service-worker.js' in changed:
            import re
            def worker_without_stamp(ref):
              source = subprocess.check_output(['git', 'show', f'{ref}:site/service-worker.js'], text=True)
              source, count = re.subn(r'^const CACHE=`\$\{CACHE_PREFIX\}[A-Za-z0-9._-]+`;$', 'const CACHE=RELEASE_STAMP;', source, flags=re.M)
              assert count == 1, 'Expected exactly one service-worker cache stamp'
              return source
            assert worker_without_stamp('HEAD^') == worker_without_stamp('HEAD'), 'Settlements UI hotfix may only change the service-worker cache stamp'
          if is_settlements_ui:
            import re
            def source(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)
            game_path = 'site/apps/settlements/runtime/assets/js/settlements/v24/game.mjs'
            if game_path in changed:
              before = source('HEAD^', game_path)
              old = 'render();map.fitFocus(targetIds());'
              new = '\n'.join([
                'render();',
                '      // First acquaint the player with the whole territory; task focus stays explicit.',
                '      map.camera.setViewport(map.element.clientWidth,map.element.clientHeight);',
                "      if(mode!=='intro'&&(!stored||updatedScenario))map.fitAll();else map.fitFocus(targetIds());",
              ])
              assert before.count(old) == 1 and source('HEAD', game_path) == before.replace(old, new), 'Runtime hotfix is limited to the initial camera overview'
            if 'site/apps/settlements/source-manifest.json' in changed:
              import json, hashlib
              previous = json.loads(source('HEAD^', 'site/apps/settlements/source-manifest.json'))
              current = json.loads(source('HEAD', 'site/apps/settlements/source-manifest.json'))
              game_bytes = subprocess.check_output(['git', 'show', f'HEAD:{game_path}'])
              game_entries = [entry for entry in current['files'] if entry['path'] == 'assets/js/settlements/v24/game.mjs']
              assert len(game_entries) == 1
              assert game_entries[0]['bytes'] == len(game_bytes) and game_entries[0]['sha256'] == hashlib.sha256(game_bytes).hexdigest()
              assert current['sourceHash'] == hashlib.sha256(json.dumps(current['files'], ensure_ascii=False, separators=(',', ':')).encode()).hexdigest()
              for manifest in [previous, current]:
                manifest.pop('sourceHash')
                manifest['files'] = [entry for entry in manifest['files'] if entry['path'] != 'assets/js/settlements/v24/game.mjs']
              assert previous == current, 'Only the camera module provenance may change'
            def without_module(source_text):
              result, count = re.subn(r'(?ms)^function renderSettlements\(.*?(?=^function stableVariant\()', '', source_text)
              assert count == 1, 'Expected exactly one native Settlements entry function'
              return result
            if 'site/assets/js/main.js' in changed:
              assert without_module(source('HEAD^', 'site/assets/js/main.js')) == without_module(source('HEAD', 'site/assets/js/main.js')), 'Only renderSettlements may change in the shared entry'
            if 'site/assets/css/site.css' in changed:
              def without_presentation(text):
                return re.sub(r'(?s)\n/\* SETTLEMENTS_PRESENTATION_BEGIN \*/.*?/\* SETTLEMENTS_PRESENTATION_END \*/\n?', '', text).rstrip()
              assert without_presentation(source('HEAD^', 'site/assets/css/site.css')) == without_presentation(source('HEAD', 'site/assets/css/site.css')), 'Only the isolated Settlements presentation styles may change'
          PY
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build pinned, self-hosted Firebase SDK
        run: |
          npm ci --ignore-scripts
          npm run build:firebase
          npm run build:career
          node site/apps/reception/localization/extract.mjs
          node site/apps/reception/localization/compile.mjs
      # RUDN_RECEPTION_CALENDAR_UPDATE
      - name: Update published reception calendars
        run: node scripts/update-reception-calendars.mjs --previous-url https://arseniy24rus.github.io/RUDN/assets/data/calendars/current.json
      - name: Validate static bundle
        if: env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_static.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Verify Governor grading and offline contract
        if: env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true'
        run: node --test scripts/test_governor_contract.mjs scripts/test_governor_i18n.mjs scripts/test_governor_service_worker.mjs scripts/test_governor_report_locale.mjs
      - name: Verify Settlements source integrity, score and persistence
        if: env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true'
        run: |
          node scripts/sync-settlements.mjs --check
          node --test scripts/test-settlements-contract.mjs scripts/test-settlements-storage.mjs
          node scripts/test_games_access.mjs --unit
      - name: Verify legacy reception assignments and lazy content integrity
        if: env.FOCUSED_HOTFIX != 'true'
        run: node site/apps/reception/content/test.mjs
      - name: Verify equivalent localized answers without changing historical grading
        if: env.FOCUSED_HOTFIX != 'true'
        run: |
          node site/apps/reception/localization/answer-alias-test.mjs
          node site/apps/reception/localization/compiled-contract-test.mjs
          node site/apps/reception/localization/reference-locale-test.mjs
          node site/apps/reception/localization/source-strings-test.mjs
      - name: Verify career locale templates and question coverage
        if: env.FOCUSED_HOTFIX != 'true'
        run: node scripts/test_career_localization.mjs
      - name: Prepare Java for isolated Firebase rules checks
        if: (env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true') && env.VERIFIED_SETTLEMENTS_PUBLISH != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Settlements permissions and result delivery in emulators
        if: (env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true') && env.VERIFIED_SETTLEMENTS_PUBLISH != 'true'
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-rudn --config firebase.puzzle.json --only auth,database "node --test scripts/test-settlements-emulator.mjs"
      - name: Verify Firebase gateway request transport and project boundaries
        run: |
          node scripts/test-firebase-gateway.mjs
          node --test firebase/functions/gateway.test.mjs
      - name: Prepare native browser checks
        if: (env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true') && env.VERIFIED_SETTLEMENTS_PUBLISH != 'true'
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium webkit
      - name: Test native Governor on desktop and mobile
        if: env.FOCUSED_HOTFIX != 'true'
        run: python scripts/test_governor_browser.py --output "${{ runner.temp }}/governor-browser-qa"
      - name: Test native Settlements, all locales and one-region loading
        if: (env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true') && env.VERIFIED_SETTLEMENTS_PUBLISH != 'true'
        run: python scripts/test-settlements-browser.py --output "${{ runner.temp }}/settlements-browser-qa"
      - name: Verify current-turn save status and cross-context restoration
        if: (env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true') && env.VERIFIED_SETTLEMENTS_PUBLISH != 'true'
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-rudn --config firebase.puzzle.json --only auth,database "python scripts/test-settlements-save-status-browser.py --port 4198"
      - name: Verify games access after native presentation changes
        if: (env.SETTLEMENTS_UI_ONLY == 'true') && env.VERIFIED_SETTLEMENTS_PUBLISH != 'true'
        shell: bash
        env:
          QA_OUT: ${{ runner.temp }}/games-access-qa
        run: |
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node scripts/test_games_access.mjs
      - name: Verify durable local queue and attachment replay
        if: (env.FOCUSED_HOTFIX != 'true' || env.SETTLEMENTS_UI_ONLY == 'true') && env.VERIFIED_SETTLEMENTS_PUBLISH != 'true'
        shell: bash
        env:
          DURABLE_TEST_BROWSERS: chromium
        run: |
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node scripts/test_durable_store.mjs
      - name: Complete eight reception cases through the real interface
        if: env.FOCUSED_HOTFIX != 'true'
        shell: bash
        env:
          DURABLE_TEST_BROWSERS: chromium
          QA_OUT: ${{ runner.temp }}/reception-browser-qa
        run: |
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          python -m http.server 8765 --bind 127.0.0.1 --protocol HTTP/1.1 --directory site > "${{ runner.temp }}/reception-server.log" 2>&1 &
          reception_server_pid=$!
          trap 'kill "$reception_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break
            sleep 0.2
          done
          for reception_locale in ru en zh; do
            RECEPTION_LOCALE="$reception_locale" node scripts/test_reception_complete.cjs
          done
          node scripts/test_reception_backup.cjs
          DURABLE_TEST_BROWSERS=chromium,webkit node scripts/test_reception_locale_race.cjs
          node scripts/test_platform_i18n.cjs
          DURABLE_TEST_BROWSERS=chromium,webkit node scripts/test_reception_entry_i18n.cjs
          DURABLE_TEST_BROWSERS=chromium,webkit node scripts/test_reception_document_labels.cjs
          node site/apps/reception/localization/test.mjs
          node site/apps/reception/localization/pack-test.mjs
          node site/apps/reception/localization/presentation-test.mjs
      - name: Check only games course access
        if: env.GAMES_ACCESS_ONLY == 'true'
        env:
          QA_OUT: ${{ runner.temp }}/games-access-qa
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node --check site/assets/js/main.js
          node --check site/assets/js/games-catalog.js
          node --check site/apps/governor/platform-bridge.js
          node --check site/service-worker.js
          node scripts/test_games_access.mjs
      - name: Check only quiz answer layout
        if: env.QUIZ_LAYOUT_ONLY == 'true'
        env:
          QA_OUT: ${{ runner.temp }}/quiz-layout-qa
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node --check site/service-worker.js
          node scripts/test_quiz_layout.mjs
      - name: Verify puzzle progress and results without mistake counters
        if: env.PUZZLE_NO_MISTAKES_ONLY == 'true'
        env:
          QA_OUT: ${{ runner.temp }}/puzzle-no-mistakes-qa
        run: |
          python -m pip install playwright==1.61.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium
          git fetch --no-tags --depth=1 origin 93698d66ca2f9f04143beba14db969d3f3927a6c
          node --check site/assets/js/puzzle-engine.js
          node --check site/assets/js/puzzle-bootstrap.js
          node --check site/service-worker.js
          node --test scripts/puzzle_snap_test.mjs scripts/test_puzzle_leaderboard.mjs
          python scripts/test_puzzle_xlsx.py --artifacts "$QA_OUT"
          python scripts/test_puzzle_no_mistakes.py --output "$QA_OUT"
      - name: Save native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governor-browser-qa
          path: |
            ${{ runner.temp }}/governor-browser-qa
            ${{ runner.temp }}/reception-browser-qa
            ${{ runner.temp }}/games-access-qa
            ${{ runner.temp }}/quiz-layout-qa
            ${{ runner.temp }}/puzzle-no-mistakes-qa
            ${{ runner.temp }}/settlements-browser-qa
            artifacts/settlements-save-status
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
