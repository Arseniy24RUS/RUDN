name: Read-only career vacancy transport probe

on:
  workflow_dispatch:
    inputs:
      verification_only:
        description: Read-only connection diagnostics; never publishes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: career-vacancy-transport-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sync-career-vacancies.mjs
            site/apps/career/assets/vacancies-model.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Probe the same public search with verified TLS
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import dns from 'node:dns/promises';
          import https from 'node:https';
          import {SEARCH_URL,FILTER,requestJSON} from './scripts/sync-career-vacancies.mjs';
          const record=value=>console.log(JSON.stringify(value));
          const safeError=e=>({name:e?.name,code:e?.code,message:String(e?.message||'').slice(0,350),cause:e?.cause?{name:e.cause.name,code:e.cause.code,message:String(e.cause.message||'').slice(0,350),errors:e.cause.errors?.map(x=>({code:x.code,address:x.address,port:x.port}))}:null});
          const host=new URL(SEARCH_URL).hostname;
          let addresses=[];
          try{addresses=await dns.lookup(host,{all:true});record({stage:'dns',node:process.version,undici:process.versions.undici,host,addresses});}
          catch(error){record({stage:'dns',error:safeError(error)});process.exit(0);}
          const body={page:1,sort:0,direction:1,pageSize:1,...FILTER};
          const boundedFetch=async(...args)=>{
            const response=await fetch(...args);
            if(!response.ok){try{await response.body?.cancel();}catch{}}
            return {ok:response.ok,status:response.status,headers:response.headers,text:async()=>{
              const reader=response.body?.getReader();if(!reader)return '';
              let size=0;const chunks=[];
              try{for(;;){const {value,done}=await reader.read();if(done)break;size+=value.byteLength;if(size>2*1024*1024){try{await reader.cancel();}catch{}throw new Error('vacancies/probe-response-limit');}chunks.push(Buffer.from(value));}}
              finally{try{reader.releaseLock();}catch{}}
              return Buffer.concat(chunks).toString('utf8');
            }};
          };
          const transportCodes=new Set(['UND_ERR_CONNECT_TIMEOUT','UND_ERR_HEADERS_TIMEOUT','UND_ERR_SOCKET','ECONNRESET','ECONNREFUSED','ETIMEDOUT','ENETUNREACH','EHOSTUNREACH','EAI_AGAIN','ENOTFOUND']);
          const isTransportFailure=error=>['AbortError','TimeoutError'].includes(error?.name)||error?.message==='fetch failed'&&(transportCodes.has(error.cause?.code)||error.cause?.errors?.some(e=>transportCodes.has(e.code)));
          let transportFailed=false;
          try{
            const result=await requestJSON(SEARCH_URL,{body,fetchImpl:boundedFetch,timeoutMs:25000,onObservation:receipt=>record({stage:'default-fetch-response',...receipt})});
            record({stage:'default-fetch',status:'ok',keys:Object.keys(result||{}),sourceTotal:result?.total??result?.totalCount??null});
          }catch(error){
            record({stage:'default-fetch',status:'error',error:safeError(error)});
            // HTTP denials and contract errors are not retried through another transport.
            if(String(error.message||'').startsWith('vacancies/')||!isTransportFailure(error))process.exit(0);
            transportFailed=true;
          }
          if(transportFailed&&addresses.some(x=>x.family===4)){
            const bytes=JSON.stringify(body);
            const started=Date.now();
            await new Promise(resolve=>{
              const request=https.request(SEARCH_URL,{method:'POST',family:4,headers:{Accept:'application/json','Content-Type':'application/json','Content-Length':Buffer.byteLength(bytes)}},response=>{
                let size=0;const chunks=[];
                response.on('data',chunk=>{size+=chunk.length;if(size>2*1024*1024){request.destroy(new Error('Probe response limit'));return;}chunks.push(chunk);});
                response.on('end',()=>{clearTimeout(timer);let validJSON=false;try{JSON.parse(Buffer.concat(chunks).toString('utf8'));validJSON=true;}catch{}record({stage:'native-https-ipv4',status:response.statusCode,bytes:size,validJSON,elapsedMs:Date.now()-started});resolve();});
                response.on('error',error=>{clearTimeout(timer);record({stage:'native-https-ipv4-response',error:safeError(error)});resolve();});
              });
              const timer=setTimeout(()=>request.destroy(Object.assign(new Error('Probe timeout'),{code:'PROBE_TIMEOUT'})),25000);
              request.on('error',error=>{clearTimeout(timer);record({stage:'native-https-ipv4',error:safeError(error),elapsedMs:Date.now()-started});resolve();});
              request.end(bytes);
            });
          }
          NODE
