              manifest['files'] = [entry for entry in manifest['files'] if entry['path'] not in patched]
            assert manifests[0] == manifests[1], 'Scenario plans, geography and unrelated runtime files must stay unchanged'
            def worker_without_stamp(ref):
              text = source_bytes(ref, 'site/service-worker.js').decode()
              text, count = re.subn(r'^const CACHE=`\$\{CACHE_PREFIX\}[A-Za-z0-9._-]+`;$', 'const CACHE=RELEASE_STAMP;', text, flags=re.M)
              assert count == 1
              return text
            assert worker_without_stamp('HEAD^') == worker_without_stamp('HEAD'), 'Only the service-worker release stamp may change'
          if os.environ['SETTLEMENTS_TOWER_BATCH'] == 'true' or os.environ['SETTLEMENTS_ROUTE_LIMITS'] == 'true':
            import json, hashlib, re
            runtime = 'site/apps/settlements/runtime/'
