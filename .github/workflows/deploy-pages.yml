name: Deploy RUDN learning platform to GitHub Pages

on:
  # RUDN_RECEPTION_CALENDAR_SCHEDULE
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_only:
        description: Build, verify and archive without publishing Pages or a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ contains(github.event.head_commit.message, '[storage-cleanup]') && format('storage-cleanup-skip-{0}', github.run_id) || contains(github.event.head_commit.message, '[reception-ai-release]') && format('reception-ai-{0}', github.run_id) || contains(github.event.head_commit.message, '[career-seminar-express]') && format('career-express-skip-{0}', github.run_id) || github.event_name == 'pull_request' && github.event.pull_request.number || (inputs.verification_only == true && github.ref) || 'production' }}
  cancel-in-progress: true

jobs:
  preserve-legacy-baseline:
    # The owner-requested express career release has its own scoped publisher.
    if: ${{ !contains(github.event.head_commit.message, '[storage-cleanup]') && (!contains(github.event.head_commit.message, '[career-seminar-express]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout baseline preservation tools
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/preserve-legacy-baseline.mjs
            scripts/download-release-baseline.mjs
          sparse-checkout-cone-mode: false
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify the reviewed first-migration ZIP or an existing backup
        id: preserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preserve-legacy-baseline.mjs --out "${{ runner.temp }}/platform-legacy-baseline-backup" --repo "${{ github.repository }}" --run-id "${{ github.run_id }}"
      - name: Retain the reviewed first-migration baseline without replacing it
        if: steps.preserve.outputs.upload_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.preserve.outputs.artifact_name }}
          path: ${{ steps.preserve.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  platform-checks:
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, '[governor-v3-publish] ')) && !contains(github.event.head_commit.message, '[course-result-recovery]') && !contains(github.event.head_commit.message, '[storage-cleanup]') && (!contains(github.event.head_commit.message, '[career-seminar-express]') && !contains(github.event.head_commit.message, '[career-verified-publish]') && !(contains(github.event.head_commit.message, '[reception-legal-reader]') || contains(github.event.head_commit.message, '[reception-ai-release]'))) }}
    uses: ./.github/workflows/platform-checks.yml

  legal-lab:
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, '[governor-v3-publish] ')) && !contains(github.event.head_commit.message, '[course-result-recovery]') && !contains(github.event.head_commit.message, '[storage-cleanup]') && (!contains(github.event.head_commit.message, '[career-seminar-express]') && !contains(github.event.head_commit.message, '[career-verified-publish]') && !(contains(github.event.head_commit.message, '[reception-legal-reader]') || contains(github.event.head_commit.message, '[reception-ai-release]'))) }}
    uses: ./.github/workflows/legal-lab-checks.yml

  puzzle-checks:
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, '[governor-v3-publish] ')) && !contains(github.event.head_commit.message, '[course-result-recovery]') && !contains(github.event.head_commit.message, '[storage-cleanup]') && (!(contains(github.event.head_commit.message, '[career-seminar-express]') || (contains(github.event.head_commit.message, '[reception-legal-reader]') || contains(github.event.head_commit.message, '[reception-ai-release]')) || contains(github.event.head_commit.message, '[career-verified-publish]') || contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]') || contains(github.event.head_commit.message, '[firebase-transport-only]') || contains(github.event.head_commit.message, '[settlements-grade-hotfix]') || contains(github.event.head_commit.message, '[settlements-network]') || contains(github.event.head_commit.message, '[settlements-road-routes]') || contains(github.event.head_commit.message, '[settlements-towers]') || contains(github.event.head_commit.message, '[settlements-boundaries]') || contains(github.event.head_commit.message, '[settlements-tower-batch]') || contains(github.event.head_commit.message, '[settlements-runtime-cache]') || contains(github.event.head_commit.message, '[settlements-route-limits]'))) }}
    uses: ./.github/workflows/puzzle-checks.yml
    with:
      coverage: full

  deploy:
    needs: [preserve-legacy-baseline, puzzle-checks, legal-lab, platform-checks]
    if: ${{ (!cancelled() && needs.preserve-legacy-baseline.result == 'success' && (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[governor-v3-publish] ')) && needs.legal-lab.result == 'skipped' && needs.platform-checks.result == 'skipped' && needs.puzzle-checks.result == 'skipped') || (!cancelled() && needs.preserve-legacy-baseline.result == 'success' && (contains(github.event.head_commit.message, '[reception-legal-reader]') || contains(github.event.head_commit.message, '[reception-ai-release]')) && needs.legal-lab.result == 'skipped' && needs.platform-checks.result == 'skipped' && needs.puzzle-checks.result == 'skipped') || (!cancelled() && needs.preserve-legacy-baseline.result == 'success' && (contains(github.event.head_commit.message, '[career-verified-publish]') || contains(github.event.head_commit.message, '[course-result-recovery]')) && needs.legal-lab.result == 'skipped' && needs.platform-checks.result == 'skipped' && needs.puzzle-checks.result == 'skipped') || (!cancelled() && needs.preserve-legacy-baseline.result == 'success' && needs.legal-lab.result == 'success' && needs.platform-checks.result == 'success' && (needs.puzzle-checks.result == 'success' || (needs.puzzle-checks.result == 'skipped' && (contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]') || contains(github.event.head_commit.message, '[firebase-transport-only]') || contains(github.event.head_commit.message, '[settlements-grade-hotfix]') || contains(github.event.head_commit.message, '[settlements-network]') || contains(github.event.head_commit.message, '[settlements-road-routes]') || contains(github.event.head_commit.message, '[settlements-towers]') || contains(github.event.head_commit.message, '[settlements-boundaries]') || contains(github.event.head_commit.message, '[settlements-tower-batch]') || contains(github.event.head_commit.message, '[settlements-runtime-cache]') || contains(github.event.head_commit.message, '[settlements-route-limits]'))))) }}
    env:
      GOVERNOR_V3_PUBLISH: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[governor-v3-publish] ') }}
      COURSE_RESULT_RECOVERY: ${{ contains(github.event.head_commit.message, '[course-result-recovery]') }}
      CAREER_VERIFIED_PUBLISH: ${{ contains(github.event.head_commit.message, '[career-verified-publish]') }}
      RECEPTION_AI_RELEASE: ${{ contains(github.event.head_commit.message, '[reception-ai-release]') }}
      RECEPTION_LEGAL_READER: ${{ (contains(github.event.head_commit.message, '[reception-legal-reader]') || contains(github.event.head_commit.message, '[reception-ai-release]')) }}
      FOCUSED_HOTFIX: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[governor-v3-publish] ')) || contains(github.event.head_commit.message, '[course-result-recovery]') || contains(github.event.head_commit.message, '[career-verified-publish]') || (contains(github.event.head_commit.message, '[reception-legal-reader]') || contains(github.event.head_commit.message, '[reception-ai-release]')) || contains(github.event.head_commit.message, '[games-access-only]') || contains(github.event.head_commit.message, '[quiz-layout-only]') || contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') || contains(github.event.head_commit.message, '[settlements-ui-only]') || contains(github.event.head_commit.message, '[firebase-transport-only]') || contains(github.event.head_commit.message, '[settlements-grade-hotfix]') || contains(github.event.head_commit.message, '[settlements-network]') || contains(github.event.head_commit.message, '[settlements-road-routes]') || contains(github.event.head_commit.message, '[settlements-towers]') || contains(github.event.head_commit.message, '[settlements-boundaries]') || contains(github.event.head_commit.message, '[settlements-tower-batch]') || contains(github.event.head_commit.message, '[settlements-runtime-cache]') || contains(github.event.head_commit.message, '[settlements-route-limits]') }}
      SETTLEMENTS_NETWORK: ${{ contains(github.event.head_commit.message, '[settlements-network]') }}
      SETTLEMENTS_ROAD_ROUTES: ${{ contains(github.event.head_commit.message, '[settlements-road-routes]') }}
      SETTLEMENTS_RUNTIME_CACHE: ${{ contains(github.event.head_commit.message, '[settlements-runtime-cache]') }}
      SETTLEMENTS_ROUTE_LIMITS: ${{ contains(github.event.head_commit.message, '[settlements-route-limits]') }}
      SETTLEMENTS_TOWER_BATCH: ${{ contains(github.event.head_commit.message, '[settlements-tower-batch]') }}
      SETTLEMENTS_BOUNDARIES: ${{ contains(github.event.head_commit.message, '[settlements-boundaries]') }}
      SETTLEMENTS_TOWERS: ${{ contains(github.event.head_commit.message, '[settlements-towers]') }}
      SETTLEMENTS_GRADE_HOTFIX: ${{ contains(github.event.head_commit.message, '[settlements-grade-hotfix]') }}
      FIREBASE_TRANSPORT_ONLY: ${{ contains(github.event.head_commit.message, '[firebase-transport-only]') }}
      SETTLEMENTS_UI_ONLY: ${{ contains(github.event.head_commit.message, '[settlements-ui-only]') }}
      VERIFIED_SETTLEMENTS_PUBLISH: ${{ contains(github.event.head_commit.message, '[settlements-ui-only]') && contains(github.event.head_commit.message, '[settlements-verified-publish]') }}
      PUZZLE_NO_MISTAKES_ONLY: ${{ contains(github.event.head_commit.message, '[puzzle-no-mistakes-only]') }}
      QUIZ_LAYOUT_ONLY: ${{ contains(github.event.head_commit.message, '[quiz-layout-only]') }}
      GAMES_ACCESS_ONLY: ${{ contains(github.event.head_commit.message, '[games-access-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_id: ${{ steps.release_archive.outputs.build_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Scope the reviewed Governor V3 publication
        if: env.GOVERNOR_V3_PUBLISH == 'true'
        env:
          GOVERNOR_BASE: ${{ github.event.before }}
          GOVERNOR_PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY_INNER'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          base = os.environ['GOVERNOR_BASE']
          release_base = '8b25c9be60ee2c6ce5d8d97a3d42a8421eb86643'
          image_hotfix_base = '5828b851c4ad9efdbff0aaa890d67c9ed1599bfc'
          cover_hotfix_base = '0770c5946dc76335d34d0707665400ff5209dbba'
          welcome_cover_base = '93eeae40c670d1d6814cc0859777ab6076900102'
          if base not in (release_base, image_hotfix_base, cover_hotfix_base, welcome_cover_base):
              raise SystemExit('Governor publication requires a reviewed base on main')
          if re.findall(r'\[[^\]\r\n]+\]', os.environ['GOVERNOR_PUSH_MESSAGE']) != ['[governor-v3-publish]']:
              raise SystemExit('Do not combine the Governor publication marker with other markers')

          if subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], stderr=subprocess.DEVNULL).returncode:
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
          reviewed = {
              'site': '0fec4db412f01b65580fec352e88821900d8a98f',
              'scripts': '6c3fed85b0a6a7703ad9c191aaeed35892160338',
              'tests': 'b741039cdd19402c004bd4abbe523bd2f8d6f8bf',
              'firebase': '51d50b289a00a40947764eb0a617f7c14b496ea7',
              '.github/workflows/platform-checks.yml': '31aa090f6b954083a8bd7080b2213bfef1e10bba',
          }
          if base == image_hotfix_base:
              reviewed['site'] = 'f303f3874fcee7e3b04484928c5f80dda03f1d34'
              reviewed['scripts'] = '45365771b3324263edc184af064c1d3862920a60'
          if base == cover_hotfix_base:
              reviewed['site'] = '011dd7ab2932fd059a3e41e326c4ff84d0e4f8b3'
              reviewed['scripts'] = '45365771b3324263edc184af064c1d3862920a60'
          if base == welcome_cover_base:
              reviewed['site'] = '5f8d55d552ab233f66ac029c58021d25b90479de'
              reviewed['scripts'] = 'd33b590f781ed9d9c8b8c165237e0fd130696ffc'
          for path, expected in reviewed.items():
              if git('rev-parse', 'HEAD:' + path) != expected:
                  raise SystemExit('Content differs from the reviewed Governor V3 candidate: ' + path)

          # The reviewed subtrees above pin both the application and its shared
          # integrations. Reject unexpected files elsewhere in the repository.
          workflow = '.github/workflows/deploy-pages.yml'
          changed = git('diff', '--name-only', '--no-renames', '-z', base, 'HEAD').rstrip('\0').split('\0')
          if base == image_hotfix_base:
              allowed_files = {
                  workflow,
                  'site/assets/js/main.js',
                  'site/apps/governor/src/v3-ui.js',
                  'site/apps/governor/src/v3-event-art.js',
                  'site/apps/governor/v3.css',
                  'scripts/build-platform-release.mjs',
                  'scripts/test-platform-release.mjs',
              }
              unexpected = sorted(set(changed) - allowed_files)
          elif base == cover_hotfix_base:
              allowed_files = {workflow, 'site/assets/js/main.js'}
              unexpected = sorted(set(changed) - allowed_files)
          elif base == welcome_cover_base:
              allowed_files = {
                  workflow,
                  'site/assets/js/main.js',
                  'site/assets/css/site.css',
                  'site/assets/course/previews/seminar_07_simulator.jpg',
                  'site/apps/governor/src/v3-ui.js',
                  'site/apps/governor/src/v3-runtime.js',
                  'site/apps/governor/v3.css',
                  'scripts/test_governor_v3_browser.py',
              }
              unexpected = sorted(set(changed) - allowed_files)
          else:
              allowed_roots = (*reviewed, workflow)
              unexpected = [path for path in changed if not any(path == root or path.startswith(root + '/') for root in allowed_roots)]
          if unexpected:
              raise SystemExit('Files outside the reviewed Governor V3 publication: ' + ', '.join(unexpected))
          PY_INNER
      # Focused hotfixes run checks for their authorized scope.
      # Reject the shortcut if the commit changes anything outside this scope.
      - name: Verify focused hotfix change scope
        env:
          RECEPTION_PUSH_BASE: ${{ github.event.before }}
          COURSE_RECOVERY_PUSH_BASE: ${{ github.event.before }}
        if: env.FOCUSED_HOTFIX == 'true' && env.GOVERNOR_V3_PUBLISH != 'true'
        run: |
          python - <<'PY'
          import os, subprocess
          games_access = {
            '.github/workflows/deploy-pages.yml',
            'scripts/test_games_access.mjs',
            'site/assets/js/games-catalog.js',
            'site/assets/js/main.js',
            'site/apps/governor/platform-bridge.js',
            'site/service-worker.js',
          }
          quiz_layout = {
            '.github/workflows/deploy-pages.yml',
            'scripts/test_quiz_layout.mjs',
            'site/assets/css/site.css',
            'site/service-worker.js',
          }
          puzzle_no_mistakes = {
            '.github/workflows/deploy-pages.yml',
            '.github/workflows/puzzle-checks.yml',
            'scripts/puzzle_snap_test.mjs',
            'scripts/test_puzzle_catalog.py',
            'scripts/test_puzzle_interactions.py',
            'scripts/test_puzzle_release_upgrade.py',
            'scripts/test_puzzle_resilience.py',
            'scripts/test_puzzle_no_mistakes.py',
            'scripts/test_puzzle_leaderboard.mjs',
            'site/apps/puzzle.html',
            'site/assets/css/puzzle.css',
            'site/assets/js/puzzle-bootstrap.js',
            'site/assets/js/puzzle-engine.js',
            'site/service-worker.js',
            'docs/puzzle-no-mistakes.md',
          }
          settlements_ui = {
            '.github/workflows/deploy-pages.yml',
            'site/apps/settlements/entry.mjs',
            'site/apps/settlements/runtime/assets/js/settlements/v24/game.mjs',
            'site/apps/settlements/source-manifest.json',
            'site/apps/settlements/module.css',
            'site/assets/js/main.js',
            'site/assets/js/settlements-presentation.js',
            'site/assets/css/site.css',
            'scripts/test-settlements-browser.py',
            'scripts/test-settlements-region-switch.py',
            'site/assets/js/settlements-storage.js',
            'scripts/test-settlements-storage.mjs',
            'scripts/test-settlements-save-status-browser.py',
            'site/service-worker.js',
          }
          is_settlements_ui = os.environ['SETTLEMENTS_UI_ONLY'] == 'true'
          allowed = settlements_ui if is_settlements_ui else puzzle_no_mistakes if os.environ['PUZZLE_NO_MISTAKES_ONLY'] == 'true' else quiz_layout if os.environ['QUIZ_LAYOUT_ONLY'] == 'true' else games_access
          if os.environ['CAREER_VERIFIED_PUBLISH'] == 'true':
            allowed = {'.github/workflows/deploy-pages.yml', 'site/apps/career/assets/loader.mjs', 'site/apps/career/assets/app.js', 'site/apps/career/assets/i18n.mjs', 'site/apps/career/runtime.bundle.mjs', 'tests/career-loader.test.mjs'}
          if os.environ['FIREBASE_TRANSPORT_ONLY'] == 'true':
            # The owner explicitly authorized skipping full module checks for
            # this reviewed gateway release. Any later product edit rejects it.
            assert subprocess.check_output(['git', 'rev-parse', 'HEAD:site'], text=True).strip() == 'bd0f98ca72f68fdd99a0761def6f65529cb12cb4'
            assert subprocess.check_output(['git', 'rev-parse', 'HEAD:firebase'], text=True).strip() == '22b145ae3fbfcfd048b357cab47ff85b157b49a9'
            allowed = {'.github/workflows/deploy-pages.yml', 'package.json', 'package-lock.json', 'open_rudn_direct.bat', 'scripts/open-rudn-direct.ps1', 'scripts/test-firebase-gateway.mjs'}
            allowed.update(subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD', 'site', 'firebase'], text=True).splitlines())
          if os.environ['SETTLEMENTS_GRADE_HOTFIX'] == 'true':
            # The owner requested urgent publication without the full matrix.
            # Only tutorial/completion presentation and recovery may change; engine rules/data stay fixed.
            allowed = {'.github/workflows/deploy-pages.yml', 'site/apps/settlements/entry.mjs', 'site/apps/settlements/copy.mjs', 'site/apps/settlements/module.css', 'site/service-worker.js', 'scripts/test-settlements-result-browser.py', 'scripts/test-settlements-tutorial-assessment-browser.py', 'scripts/test-settlements-training-gates-browser.py', 'scripts/test-settlements-course-status.mjs', 'scripts/test-settlements-course-recovery.mjs', 'scripts/test-settlements-dashboard-browser.py', 'site/assets/js/settlements-course-status.js', 'site/apps/settlements/runtime/assets/js/settlements/v24/game.mjs', 'site/apps/settlements/runtime/assets/js/settlements/v24/i18n.mjs', 'site/apps/settlements/source-manifest.json', 'site/assets/js/main.js', 'site/assets/js/firebase-gateway.js', 'scripts/test-firebase-gateway.mjs'}
          if os.environ['SETTLEMENTS_ROAD_ROUTES'] == 'true':
            runtime = 'site/apps/settlements/runtime/'
            paths = {'assets/js/settlements/v24/engine.mjs', 'assets/js/settlements/v24/network-routing.mjs', 'assets/js/settlements/v24/game.mjs', 'assets/js/settlements/v24/map.mjs', 'assets/js/settlements/v24/i18n.mjs', 'assets/css/settlements-v24.css'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/source-manifest.json', 'scripts/test-settlements-road-routes.mjs', 'scripts/test-settlements-road-routes-browser.py', 'scripts/audit-settlements-road-routes.mjs'} | {runtime + path for path in paths}
          if os.environ['SETTLEMENTS_NETWORK'] == 'true':
            import json, hashlib, re
            runtime = 'site/apps/settlements/runtime/'
            patched = {'assets/js/settlements/v2/network.mjs', 'assets/js/settlements/v2/data.mjs', 'assets/js/settlements/v24/social-plan-fetch.mjs', 'assets/js/settlements/v24/transport-policy-fetch.mjs', 'assets/js/settlements/v24/federal-cities.mjs'}
            allowed = {'.github/workflows/deploy-pages.yml', 'site/service-worker.js', 'site/apps/settlements/entry.mjs', 'site/assets/js/settlements-storage.js', 'site/apps/settlements/source-manifest.json', 'firebase/functions/gateway.mjs', 'firebase/functions/gateway.test.mjs', 'scripts/test-settlements-network.mjs', 'scripts/test-settlements-network-browser.mjs', 'scripts/test-settlements-storage.mjs'} | {runtime + path for path in patched}
            def source(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'])
            previous, current = [json.loads(source(ref, 'site/apps/settlements/source-manifest.json')) for ref in ['HEAD^','HEAD']]
            assert current['sourceHash'] == hashlib.sha256(json.dumps(current['files'], ensure_ascii=False, separators=(',',':')).encode()).hexdigest()
            for entry in current['files']:
              if entry['path'] in patched:
                data = source('HEAD', runtime + entry['path'])
                assert entry['bytes'] == len(data) and entry['sha256'] == hashlib.sha256(data).hexdigest()
            for manifest in [previous,current]:
              manifest.pop('sourceHash')
              manifest['files'] = [entry for entry in manifest['files'] if entry['path'] not in patched]
            assert previous == current, 'Game rules, authored plans and protected geography must stay unchanged'
            def worker_without_network_stamp(ref):
              text = source(ref,'site/service-worker.js').decode()
              text = re.sub(r'^const CACHE=.*?;$','CACHE_STAMP',text,flags=re.M)
              return text.replace("'./apps/settlements/runtime/assets/js/settlements/v2/network.mjs',",'')
            assert worker_without_network_stamp('HEAD^') == worker_without_network_stamp('HEAD'), 'Existing release/geometry cache protections must stay unchanged'
            def firebase_routes(ref):
              return source(ref,'firebase/functions/gateway.mjs').decode().split('export function upstreamFor(',1)[1].split('export async function handle(',1)[0]
            assert firebase_routes('HEAD^') == firebase_routes('HEAD'), 'Firebase authentication/database/storage routes must stay unchanged'
          if os.environ['SETTLEMENTS_TOWERS'] == 'true':
