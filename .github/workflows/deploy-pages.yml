          QA_OUT: ${{ runner.temp }}/games-access-qa
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node --check site/assets/js/main.js
          node --check site/assets/js/games-catalog.js
          node --check site/apps/governor/platform-bridge.js
          node --check site/service-worker.js
          node scripts/test_games_access.mjs
      - name: Check only quiz answer layout
        if: env.QUIZ_LAYOUT_ONLY == 'true'
        env:
          QA_OUT: ${{ runner.temp }}/quiz-layout-qa
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node --check site/service-worker.js
          node scripts/test_quiz_layout.mjs
      - name: Verify puzzle progress and results without mistake counters
        if: env.PUZZLE_NO_MISTAKES_ONLY == 'true'
        env:
          QA_OUT: ${{ runner.temp }}/puzzle-no-mistakes-qa
        run: |
          python -m pip install playwright==1.61.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium
          git fetch --no-tags --depth=1 origin 93698d66ca2f9f04143beba14db969d3f3927a6c
          node --check site/assets/js/puzzle-engine.js
          node --check site/assets/js/puzzle-bootstrap.js
          node --check site/service-worker.js
          node --test scripts/puzzle_snap_test.mjs scripts/test_puzzle_leaderboard.mjs
          python scripts/test_puzzle_xlsx.py --artifacts "$QA_OUT"
          python scripts/test_puzzle_no_mistakes.py --output "$QA_OUT"
      - name: Save native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governor-browser-qa
          path: |
            ${{ runner.temp }}/governor-browser-qa
            ${{ runner.temp }}/reception-browser-qa
            ${{ runner.temp }}/games-access-qa
            ${{ runner.temp }}/quiz-layout-qa
            ${{ runner.temp }}/puzzle-no-mistakes-qa
            ${{ runner.temp }}/settlements-browser-qa
            artifacts/settlements-save-status
            ${{ runner.temp }}/settlements-network-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure Pages
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.verification_only == false) }}
        uses: actions/configure-pages@v5
      - name: Build and verify exact runtime and immutable resources
        run: node scripts/build-platform-release.mjs --site site --baseline "${{ runner.temp }}/platform-baseline" --out "${{ runner.temp }}/platform-staging" --verify
      - name: Verify actual immutable main and module routes
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
          export PLAYWRIGHT_MODULE_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          node scripts/platform-main-staging.mjs --a "${{ runner.temp }}/platform-staging" --b "${{ runner.temp }}/platform-staging" --kind modules --browser chromium --output "${{ runner.temp }}/platform-main-staging"
      - name: Retain immutable main smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-main-staging
          path: ${{ runner.temp }}/platform-main-staging
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive verified staging and checksum
        id: release_archive
        run: node scripts/archive-platform-release.mjs --site "${{ runner.temp }}/platform-staging" --out "${{ runner.temp }}/platform-release-archive"
      - name: Retain the exact baseline for recovery
        uses: actions/upload-artifact@v4
        with:
          name: platform-release-${{ steps.release_archive.outputs.build_id }}
          path: ${{ runner.temp }}/platform-release-archive
          if-no-files-found: error
          retention-days: 90
      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.verification_only == false) }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ steps.release_archive.outputs.build_id }}
          path: ${{ runner.temp }}/platform-staging

  publish-pages:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.verification_only == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified immutable staging
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ needs.deploy.outputs.build_id }}

  retain-successful-release:
    needs: [deploy, publish-pages]
    if: ${{ needs.deploy.result == 'success' && needs.publish-pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download only the successfully deployed exact archive
        uses: actions/download-artifact@v4
        with:
          name: platform-release-${{ needs.deploy.outputs.build_id }}
          path: release-archive
      - name: Verify and retain the immutable GitHub Release archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ needs.deploy.outputs.build_id }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-archive
          sha256sum --check "platform-release-${BUILD_ID}.tar.gz.sha256"
          tag="platform-release-${BUILD_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern receipt.json --dir existing
            node -e 'const fs=require("fs");const old=JSON.parse(fs.readFileSync("existing/receipt.json"));if(old.buildId!==process.env.BUILD_ID||old.status!=="pass")process.exit(1);'
          else
            gh release create "$tag" "${tag}.tar.gz" "${tag}.tar.gz.sha256" receipt.json --target "$TARGET_SHA" --title "Platform ${BUILD_ID}" --notes "Exact verified GitHub Pages deployment. Runtime, immutable resources and checksums retained for baseline recovery."
          fi
