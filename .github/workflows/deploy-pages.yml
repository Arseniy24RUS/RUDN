            if 'site/assets/css/site.css' in changed:
              def without_presentation(text):
                return re.sub(r'(?s)\n/\* SETTLEMENTS_PRESENTATION_BEGIN \*/.*?/\* SETTLEMENTS_PRESENTATION_END \*/\n?', '', text).rstrip()
              assert without_presentation(source('HEAD^', 'site/assets/css/site.css')) == without_presentation(source('HEAD', 'site/assets/css/site.css')), 'Only the isolated Settlements presentation styles may change'
