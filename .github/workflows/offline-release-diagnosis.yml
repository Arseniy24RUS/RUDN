name: Firefox offline release diagnosis

on:
  push:
    branches: [codex/offline-release-diagnosis]

permissions:
  contents: read

jobs:
  native-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build:firebase && npm run build:career
      - run: python -m pip install playwright==1.61.0
      - run: python -m playwright install --with-deps firefox
      - name: Preserve the original diagnostics then release scenario sequence
        env:
          RELEASE_BROWSERS: firefox
          DIAGNOSTICS_BROWSERS: firefox
          QA_OUT: ${{ runner.temp }}/release-firefox
          DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/diagnostics-firefox
        run: |
          export PLAYWRIGHT_MODULE_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          export PLAYWRIGHT_PATH="$PLAYWRIGHT_MODULE_PATH"
          node scripts/diagnostics-v2-browser.mjs
          node scripts/test-platform-release-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-offline-release
          path: |
            ${{ runner.temp }}/release-firefox
            ${{ runner.temp }}/diagnostics-firefox
          retention-days: 30
