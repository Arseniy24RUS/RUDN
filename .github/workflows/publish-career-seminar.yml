# Focused publication of Seminar 5; source changes are scoped against bbc7318.
name: Publish Seminar 5 career journey with focused checks

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ contains(github.event.head_commit.message, '[career-seminar-express]') && 'pages-production' || format('career-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  career-ui:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[career-seminar-express]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct the lazy public vacancy bank
        if: ${{ contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: python scripts/unpack-career-vacancies.py
      - name: Build the career module
        timeout-minutes: 5
        run: |
          npm ci --ignore-scripts
          npm run build:firebase
          npm run build:career
      - name: Install Playwright
        timeout-minutes: 5
        run: python -m pip install playwright==1.61.0
      - name: Install browser system dependencies
        timeout-minutes: 8
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          python -m playwright install-deps "${{ matrix.browser }}"
      - name: Install browser
        timeout-minutes: 5
        run: python -m playwright install "${{ matrix.browser }}"
      - name: Verify recommended-employer vacancies and bounded lazy loading
        if: ${{ contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: |
          export PLAYWRIGHT_MODULE_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          node scripts/test_career_vacancy_bank_ui.mjs --browser "${{ matrix.browser }}" --output "${{ runner.temp }}/career-ui/vacancies"
      - name: Verify the personality stage in Russian, English and Chinese
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: |
          export PLAYWRIGHT_MODULE_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          node scripts/test_personality_ui.mjs --browser "${{ matrix.browser }}" --output "${{ runner.temp }}/career-ui/personality"
      - name: Verify touch map gestures and preferred employer reordering
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: |
          export PLAYWRIGHT_MODULE_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          node scripts/test_career_preferences_ui.mjs --browser "${{ matrix.browser }}" --output "${{ runner.temp }}/career-ui/preferences"
      - name: Restore existing Seminar 5 work through personality and preferences
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: |
          export PLAYWRIGHT_MODULE_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          node scripts/test_career_update_migration.mjs --browser "${{ matrix.browser }}" --output "${{ runner.temp }}/career-ui/migration"
      - name: Keep course and free career sessions independent
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        env:
          FREE_MODULES: career
          DURABLE_TEST_BROWSERS: ${{ matrix.browser }}
        run: |
          export PLAYWRIGHT_PATH="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          node scripts/test_free_module_contexts.mjs
      - name: Retain focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-ui-${{ matrix.browser }}
          path: ${{ runner.temp }}/career-ui
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: career-ui
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[career-seminar-express]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      build_id: ${{ steps.archive.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the authorized Seminar 5 change scope and syntax
        run: |
          git fetch --no-tags --depth=1 origin bbc731814813486541108a3abacfafd1f0cfa4a8
          node scripts/verify-career-express-release.mjs --scope
      - name: Reconstruct the lazy public vacancy bank
        if: ${{ contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: python3 scripts/unpack-career-vacancies.py
      - name: Build the career component and existing deterministic assets
        run: |
          npm ci --ignore-scripts
          npm run build:career
          git diff --exit-code -- site/apps/career/runtime.bundle.mjs site/apps/career/module.css
          npm run build:firebase
      - name: Rebuild existing reception localization for earlier career releases
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: |
          node site/apps/reception/localization/extract.mjs
          node site/apps/reception/localization/compile.mjs
      - name: Verify vacancy codec, source links, paging and lazy release metadata
        if: ${{ contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: |
          node --test tests/employer-vacancies-bank.test.mjs tests/career-vacancy-lazy-release.test.mjs
          python3 scripts/test_repack_career_vacancies.py
      - name: Verify scoring, territory ranking and sourced requirement assessment
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: |
          node scripts/test_personality_model.mjs
          node scripts/test_personality_insights.mjs
          node scripts/test_career_localization.mjs
          node --test tests/career-scoring-portfolio.test.mjs tests/career-model-upgrade.test.mjs tests/career-course-prerequisite.test.mjs tests/career-journey-model.test.mjs tests/career-territorial-catalog.test.mjs tests/personality-visuals.test.mjs tests/career-region-map.test.mjs tests/career-wish-sortable.test.mjs
      - name: Verify the reusable territory map is deterministic
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: node site/apps/career/data/regions/build-map.mjs --check
      - name: Install the isolated DOM test dependency
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        run: npm install --ignore-scripts --no-audit --no-fund --prefix "${{ runner.temp }}/career-dom-qa" happy-dom@21.0.4
      - name: Verify the complete career journey with DOM interactions
        if: ${{ !contains(github.event.head_commit.message, '[career-vacancies]') }}
        env:
          HAPPY_DOM_MODULE_PATH: ${{ runner.temp }}/career-dom-qa/node_modules/happy-dom/lib/index.js
        run: node scripts/test_career_journey_ui.mjs --output "${{ runner.temp }}/career-dom-qa/report.json"
      - name: Retain focused DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-journey-dom
          path: ${{ runner.temp }}/career-dom-qa/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retrieve the published baseline and preserve its calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-release-baseline.mjs --out "${{ runner.temp }}/platform-baseline" --repo "${{ github.repository }}" --seed-calendar site/assets/data/calendars/current.json
      - name: Keep the current vacancy snapshot
        run: node scripts/verify-career-express-release.mjs --seed-vacancies --baseline "${{ runner.temp }}/platform-baseline"
      - name: Build the immutable release with the existing publisher
        run: node scripts/build-platform-release.mjs --site site --baseline "${{ runner.temp }}/platform-baseline" --out "${{ runner.temp }}/platform-staging" --verify
      - name: Require unchanged published resources outside Seminar 5
        run: node scripts/verify-career-express-release.mjs --compare --baseline "${{ runner.temp }}/platform-baseline" --staging "${{ runner.temp }}/platform-staging"
      - name: Archive the verified release
        id: archive
        run: node scripts/archive-platform-release.mjs --site "${{ runner.temp }}/platform-staging" --out "${{ runner.temp }}/platform-archive"
      - name: Retain the archive before changing the live site
        uses: actions/upload-artifact@v4
        with:
          name: platform-release-${{ steps.archive.outputs.build_id }}
          path: ${{ runner.temp }}/platform-archive
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ steps.archive.outputs.build_id }}
          path: ${{ runner.temp }}/platform-staging
      - name: Check that the source and live baseline have not moved
        env:
          BASELINE: ${{ runner.temp }}/platform-baseline
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const previous=JSON.parse(fs.readFileSync(path.join(process.env.BASELINE,'release.json'),'utf8'));
          const response=await fetch('https://arseniy24rus.github.io/RUDN/release.json',{cache:'no-store',signal:AbortSignal.timeout(30000)});
          assert.equal(response.status,200);assert.deepEqual((await response.json()).current,previous.current);
          NODE
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ steps.archive.outputs.build_id }}
      - name: Retain the published release for updates and rollback
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ steps.archive.outputs.build_id }}
          TARGET_SHA: ${{ github.sha }}
        working-directory: ${{ runner.temp }}/platform-archive
        run: |
          set -euo pipefail
          sha256sum --check "platform-release-${BUILD_ID}.tar.gz.sha256"
          tag="platform-release-${BUILD_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern receipt.json --dir existing
            node -e 'const fs=require("fs");const old=JSON.parse(fs.readFileSync("existing/receipt.json"));if(old.buildId!==process.env.BUILD_ID||old.status!=="pass")process.exit(1);'
          else
            notes="Seminar 5: source-backed employer vacancies with active and archived labels, lazy compressed paging and bounded client loading. Focused checks cover this vacancy flow in Chromium, Firefox and WebKit, the dataset codec and immutable collection routing. The source seed and rollback release are retained. No full-platform UI testing is claimed."
            gh release create "$tag" "${tag}.tar.gz" "${tag}.tar.gz.sha256" receipt.json --target "$TARGET_SHA" --title "Platform ${BUILD_ID}" --notes "$notes"
          fi
