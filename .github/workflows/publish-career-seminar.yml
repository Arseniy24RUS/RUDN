name: Publish Seminar 5 with focused checks

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[career-seminar-express]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      build_id: ${{ steps.archive.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the authorized Seminar 5 change scope and syntax
        run: |
          git fetch --no-tags --depth=1 origin 40eff0ec2693232dadd8f727c229b15b62829c8c
          node scripts/verify-career-express-release.mjs --scope
      - name: Build the career component and existing deterministic assets
        run: |
          npm ci --ignore-scripts
          npm run build:career
          git diff --exit-code -- site/apps/career/runtime.bundle.mjs site/apps/career/module.css
          node scripts/test_career_localization.mjs
          npm run build:firebase
          node site/apps/reception/localization/extract.mjs
          node site/apps/reception/localization/compile.mjs
      - name: Retrieve the published baseline and preserve its calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-release-baseline.mjs --out "${{ runner.temp }}/platform-baseline" --repo "${{ github.repository }}" --seed-calendar site/assets/data/calendars/current.json
      - name: Keep the current vacancy snapshot
        run: node scripts/verify-career-express-release.mjs --seed-vacancies --baseline "${{ runner.temp }}/platform-baseline"
      - name: Build the immutable release with the existing publisher
        run: node scripts/build-platform-release.mjs --site site --baseline "${{ runner.temp }}/platform-baseline" --out "${{ runner.temp }}/platform-staging" --verify
      - name: Require unchanged published resources outside Seminar 5
        run: node scripts/verify-career-express-release.mjs --compare --baseline "${{ runner.temp }}/platform-baseline" --staging "${{ runner.temp }}/platform-staging"
      - name: Archive the verified release
        id: archive
        run: node scripts/archive-platform-release.mjs --site "${{ runner.temp }}/platform-staging" --out "${{ runner.temp }}/platform-archive"
      - name: Retain the archive before changing the live site
        uses: actions/upload-artifact@v4
        with:
          name: platform-release-${{ steps.archive.outputs.build_id }}
          path: ${{ runner.temp }}/platform-archive
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ steps.archive.outputs.build_id }}
          path: ${{ runner.temp }}/platform-staging
      - name: Check that the source and live baseline have not moved
        env:
          BASELINE: ${{ runner.temp }}/platform-baseline
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const previous=JSON.parse(fs.readFileSync(path.join(process.env.BASELINE,'release.json'),'utf8'));
          const response=await fetch('https://arseniy24rus.github.io/RUDN/release.json',{cache:'no-store',signal:AbortSignal.timeout(30000)});
          assert.equal(response.status,200);assert.deepEqual((await response.json()).current,previous.current);
          NODE
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ steps.archive.outputs.build_id }}
      - name: Retain the published release for updates and rollback
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ steps.archive.outputs.build_id }}
          TARGET_SHA: ${{ github.sha }}
        working-directory: ${{ runner.temp }}/platform-archive
        run: |
          set -euo pipefail
          sha256sum --check "platform-release-${BUILD_ID}.tar.gz.sha256"
          tag="platform-release-${BUILD_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern receipt.json --dir existing
            node -e 'const fs=require("fs");const old=JSON.parse(fs.readFileSync("existing/receipt.json"));if(old.buildId!==process.env.BUILD_ID||old.status!=="pass")process.exit(1);'
          else
            gh release create "$tag" "${tag}.tar.gz" "${tag}.tar.gz.sha256" receipt.json --target "$TARGET_SHA" --title "Platform ${BUILD_ID}" --notes "Seminar 5 profile, authority descriptions and mobile layout. Owner requested focused career checks and immediate publication; no full-platform test run. Immutable resources and rollback archive verified."
          fi
