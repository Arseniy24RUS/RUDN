<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">RUDN course platform workflow</title>
  <desc id="desc">Students and teachers open the static course shell, move through materials and activities, and optional Firebase synchronization stores submitted results when configured.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0079c1"/>
    </marker>
    <style>
      .bg{fill:#f4f9fd}.panel{fill:#fff;stroke:#c9ddeb;stroke-width:3;rx:18}.box{fill:#e8f5fb;stroke:#0079c1;stroke-width:3;rx:14}.alt{fill:#fff7e5;stroke:#e0a93c;stroke-width:3;rx:14}.out{fill:#eef8ef;stroke:#4f9c67;stroke-width:3;rx:14}.title{font:700 30px Arial, sans-serif;fill:#14324a}.label{font:700 24px Arial, sans-serif;fill:#14324a}.small{font:20px Arial, sans-serif;fill:#31475a}.arrow{stroke:#0079c1;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="560"/>
  <text class="title" x="42" y="54">Course data flow with optional synchronization</text>
  <rect class="panel" x="34" y="88" width="1032" height="420"/>
  <rect class="box" x="70" y="145" width="230" height="120"/>
  <text class="label" x="96" y="185">Course shell</text>
  <text class="small" x="96" y="219">RU / EN / ZH</text>
  <text class="small" x="96" y="247">schedule, profile</text>
  <path class="arrow" d="M302 205 H410"/>
  <rect class="box" x="410" y="106" width="260" height="110"/>
  <text class="label" x="438" y="148">Materials</text>
  <text class="small" x="438" y="182">lectures and tests</text>
  <rect class="box" x="410" y="246" width="260" height="110"/>
  <text class="label" x="438" y="288">Activities</text>
  <text class="small" x="438" y="322">games and modules</text>
  <rect class="alt" x="410" y="386" width="260" height="86"/>
  <text class="label" x="438" y="425">Local state</text>
  <text class="small" x="438" y="455">drafts and queue</text>
  <path class="arrow" d="M672 160 H795"/>
  <path class="arrow" d="M672 300 H795"/>
  <rect class="out" x="795" y="138" width="240" height="126"/>
  <text class="label" x="825" y="180">Result records</text>
  <text class="small" x="825" y="214">scores and reports</text>
  <text class="small" x="825" y="242">owned by course rules</text>
  <rect class="out" x="795" y="315" width="240" height="126"/>
  <text class="label" x="825" y="357">Cloud sync</text>
  <text class="small" x="825" y="391">protected profiles</text>
  <text class="small" x="825" y="419">teacher gradebook</text>
  <path class="arrow" d="M915 265 V313"/>
  <text class="small" x="72" y="476">Boundary: static Pages serves the client; configured Firebase handles synchronization.</text>
  <text class="small" x="72" y="504">Production identity and rules must be validated separately.</text>
</svg>
